    $yearSheet.classList.add("open");
  }
  function closeYearSheet() { $yearSheet.classList.remove("open"); }

  $yearBackdrop.addEventListener("click", closeYearSheet);
  $yearClose.addEventListener("click", closeYearSheet);
  $yearList.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".series-row") : null;
    if (!row) return;
    var y = row.getAttribute("data-year");
    closeYearSheet();
    if (y && y !== curYear) { loadCollection(curAssort, y); window.scrollTo(0, 0); }
  });

  // --- Card scanner ---
  // Photograph a blister card, read its text on the device with PaddleOCR
  // models (lazy-loaded, see getEngine), then fuzzy-match that text against every car
  // in data/scan-index.json (all years and assortments, built by
  // scripts/build-scan-index.js). Tapping a match loads that car's collection
  // and opens its detail view.
  // Text reading: PaddleOCR models (./models, ~24 MB) on ONNX Runtime Web
  // (pinned + SRI; its WASM binary loads from the same pinned CDN path).
  // The pipeline itself is ./ocr.js. Detection: PP-OCRv3 English (best at
  // finding small card text in our tests). Recognition: PP-OCRv6 small, limited
  // to Latin characters so it never emits CJK look-alikes.
  var ORT_BASE = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
  var ORT_SRC = ORT_BASE + "ort.wasm.min.js";
  var ORT_SRI = "sha384-tNxIwEqSlcdvKtUte98AsccPbDKM958LBXB/+3BLS42TTihXHKTWgdqPqXI/lot8";
  var OCR_MODELS = {
    detUrl: "./models/en_PP-OCRv3_det_infer.onnx",
    recUrl: "./models/PP-OCRv6_small_rec.onnx",
    dictUrl: "./models/ppocrv6_dict.txt",
    charset: /^[ -~\u00C0-\u017F™®]$/
  };
  // Files downloaded with a progress bar, and their uncompressed sizes (used
  // as the total when the server compresses and omits Content-Length).
  var OCR_FILES = [
    { key: "wasm", url: ORT_BASE + "ort-wasm-simd-threaded.wasm", size: 14848852 },
    { key: "det", url: OCR_MODELS.detUrl, size: 2423224 },
    { key: "rec", url: OCR_MODELS.recUrl, size: 21159378 }
  ];
  var OCR_MIN_SCORE = 0.65; // drop lines the model is unsure of (reflections, art)
  function scanImg(id) {
    var e = encodeURIComponent(id);
    return "https://findmyhw.com/media/images/" + e + "/" + e + "_1.webp";
  }

  var $scanBtn = document.getElementById("scanBtn");
  var $scanner = document.getElementById("scanner");
  var $scanClose = document.getElementById("scanClose");
  var $scanStage = document.querySelector(".scanstage");
  var $scanFrame = document.querySelector(".scanframe");
  var $scanVideo = document.getElementById("scanVideo");
  var $scanSnap = document.getElementById("scanSnap");
  var $scanStatus = document.getElementById("scanStatus");
  var $scanText = document.getElementById("scanText");
  var $scanList = document.getElementById("scanList");
  var $scanColor = document.getElementById("scanColor");
  var $scanShutter = document.getElementById("scanShutter");
  var $scanUpload = document.getElementById("scanUpload");
  var $scanRetake = document.getElementById("scanRetake");
  var $scanFile = document.getElementById("scanFile");
  var $scanProg = document.getElementById("scanProg");
  var $scanProgBar = document.getElementById("scanProgBar");
  var $scanProgLabel = document.getElementById("scanProgLabel");

  // run: bumped on every new action so late async results from an older
  // capture / close are ignored.
  // dl: download progress of the text reader, null when not downloading.
  // read: reading progress (0..1) during a scan, null otherwise.
  var SC = { open: false, run: 0, stream: null, engine: null, engineP: null,
             index: null, indexP: null, matches: [], dl: null, read: null };
  function setMode(m) { $scanner.className = "scanner open " + m; renderProgress(); }
  function setStatus(t) { $scanStatus.textContent = t || ""; }

  // Resolves after the browser has painted the current state (two frames), so
  // the captured photo and progress bar show before heavy work blocks it.
  function waitPaint() {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(resolve, 0); }); });
    });
  }

  // One progress bar for both: the download (shown whenever it's running,
  // even while aiming) takes priority, then reading progress during a scan.
  // The shutter and Photo buttons stay disabled until the download is done.
  function renderProgress() {
    var label = "", frac = null, downloading = !!SC.dl;
    $scanShutter.disabled = downloading;
    $scanUpload.disabled = downloading;
    if (SC.dl) {
      var mb = function (b) { return (b / 1048576).toFixed(1); };
      frac = SC.dl.total ? SC.dl.loaded / SC.dl.total : 0;
      label = "Downloading text reader (first time only) · " + mb(SC.dl.loaded) + " / " + mb(SC.dl.total) + " MB";
    } else if (SC.read != null && $scanner.classList.contains("busy")) {
      frac = SC.read;
      label = SC.readLabel || "Reading card…";
    }
    if (frac == null) { $scanProg.hidden = true; return; }
    frac = Math.max(0, Math.min(1, frac));
    $scanProg.hidden = false;
    $scanProgBar.style.transform = "scaleX(" + frac.toFixed(3) + ")";
    $scanProgLabel.textContent = label + " " + Math.round(frac * 100) + "%";
  }

  function loadScript(src, sri) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.async = true;
      if (sri) { s.integrity = sri; s.crossOrigin = "anonymous"; }
      s.onload = resolve;
      s.onerror = function () { s.remove(); reject(new Error("couldn't load " + src.split("/").pop())); };
      document.head.appendChild(s);
    });
  }

  // Load the runtime, the pipeline and both models once; kept for the session
  // (re-opening the scanner is then instant).
  function getEngine() {
    if (SC.engine) return Promise.resolve(SC.engine);
    if (SC.engineP) return SC.engineP;
    var p = SC.engineP = (window.ort ? Promise.resolve() : loadScript(ORT_SRC, ORT_SRI))
      .then(function () { return window.PaddleOCRLite ? null : loadScript("./ocr.js"); })
      .then(function () {
        if (!window.ort || !window.PaddleOCRLite) throw new Error("text reader missing");
        // Download the runtime binary and both models ourselves so the bar can
        // show real progress (cached files finish almost instantly).
        var got = {}, total = 0;
        OCR_FILES.forEach(function (f) { got[f.key] = { loaded: 0, total: f.size }; total += f.size; });
        SC.dl = { loaded: 0, total: total };
        renderProgress();
        function update() {
          var l = 0, t = 0;
          for (var k in got) { l += got[k].loaded; t += got[k].total; }
          SC.dl = { loaded: l, total: t };
          renderProgress();
        }
        return Promise.all(OCR_FILES.map(function (f) {
          return window.PaddleOCRLite.fetchBuf(f.url, function (loaded, tot) {
            got[f.key] = { loaded: loaded, total: tot || f.size };
            update();
          }, f.size);
        }));
      })
      .then(function (bufs) {
        var ort = window.ort;
        ort.env.wasm.wasmPaths = ORT_BASE;   // the small .mjs loader still comes from here
        ort.env.wasm.wasmBinary = bufs[0];  // already downloaded above
        // Multi-threading needs cross-origin isolation, which GitHub Pages lacks.
        ort.env.wasm.numThreads = 1;
        // Run inference in a background worker so the page (camera preview,
        // progress bar) keeps updating while a card is read.
        ort.env.wasm.proxy = true;
        return window.PaddleOCRLite.load({
          ort: ort, detBuf: bufs[1], recBuf: bufs[2],
          dictUrl: OCR_MODELS.dictUrl, charset: OCR_MODELS.charset
        });
      })
      .then(function (e) { SC.engine = e; SC.dl = null; renderProgress(); return e; });
    p.catch(function () {
      if (SC.engineP === p) SC.engineP = null;
      SC.dl = null; renderProgress();
    });
    return p;
  }

  // ---- Matching ----
  // Words printed on most cards. They still count when they're part of a
  // casting name, but with low weight so they can't produce a match alone.
  var BOILER = {};
  ("HOT WHEELS MATTEL WARNING CHOKING HAZARD SMALL PARTS NOT FOR CHILDREN UNDER " +
   "YEARS AGE AGES THE AND OF A HW COLLECT THEM ALL MADE IN MALAYSIA THAILAND CHINA " +
   "INDONESIA TREASURE HUNT SERIES NEW MODEL SCALE DIE CAST 1 64 3")
    .split(" ").forEach(function (w) { BOILER[w] = true; });

  // Brand/packaging words to drop from what the reader returns. Partial reads
  // count too ("TTEL" from a half-visible MATTEL logo).
  var NOISE_WORDS = ["MATTEL", "HOTWHEELS", "HOT", "WHEELS", "WARNING", "CHOKING", "HAZARD",
                     "SMALL", "PARTS", "CHILDREN", "UNDER", "YEARS", "AGES", "COLLECTOR"];
  function isNoiseWord(t) {
    if (t.length <= 2) return true; // "3", "3+", stray letters
    for (var i = 0; i < NOISE_WORDS.length; i++) {
      var n = NOISE_WORDS[i];
      if (t === n || (t.length >= 3 && n.indexOf(t) !== -1)) return true;
      if (t.length >= 5 && Math.abs(t.length - n.length) <= 1 && lev(t, n) <= 1) return true;
    }
    return false;
  }
  // Words that only appear in the safety warning; any of them (even misread)
  // marks the whole line as the warning.
  var WARNING_WORDS = ["WARNING", "CHOKING", "HAZARD", "CHILDREN", "ADVERTENCIA", "ATTENTION"];
  // A line made only of noise words, or the warning line, is dropped; real
  // names are kept whole.
  function isNoiseLine(s) {
    var toks = norm(s).split(" ").filter(Boolean), i, j;
    for (i = 0; i < toks.length; i++) {
      if (toks[i].length < 5) continue;
      for (j = 0; j < WARNING_WORDS.length; j++) {
        var wd = WARNING_WORDS[j];
        if (Math.abs(toks[i].length - wd.length) <= 2 && lev(toks[i], wd) <= 2) return true;
      }
    }
    for (i = 0; i < toks.length; i++) if (!isNoiseWord(toks[i])) return false;
    return true;
  }

  function norm(s) {
    var v = String(s || "");
    if (v.normalize) v = v.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return v.toUpperCase()
      .replace(/['’‘`´]/g, "")
      .replace(/&/g, " AND ")
      .replace(/[^A-Z0-9]+/g, " ")
      .trim();
  }

  // A boilerplate word, or a near-spelling of one (so a casting like
  // "Hot Wheengs" can't match on the logo printed on every card).
  function isBoiler(t) {
    if (BOILER[t]) return true;
    if (t.length < 5) return false;
    for (var b in BOILER) {
      if (b.length >= 5 && Math.abs(b.length - t.length) <= 2 && lev(t, b) <= 2) return true;
    }
    return false;
  }

  function titleTokens(key) {
    return key.split(" ").filter(Boolean).map(function (t) {
      var w = t.length === 1 ? 0.5 : Math.min(t.length, 8);
      var boiler = isBoiler(t);
      if (boiler) w *= 0.25;
      return { t: t, w: w, boiler: boiler };
    });
  }

  function prepIndex(data) {
    var f = (data && data.fields) || [], col = {};
    for (var i = 0; i < f.length; i++) col[f[i]] = i;
    var rows = (data && data.cars) || [], byKey = {}, titles = [];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var car = {
        id: row[col.id], title: row[col.title], year: String(row[col.year]),
        assort: row[col.assortment], sku: String(row[col.sku] || "").toUpperCase(),
        num: String(row[col.number] || ""), series: row[col.series] || "",
        rarity: row[col.rarity] || "", img: !!row[col.img],
        color: col.color != null ? (row[col.color] || "") : ""
      };
      var key = norm(car.title);
      if (!key) continue;
      var t = byKey[key];
      if (!t) {
        var toks = titleTokens(key), pairs = [], content = 0;
        for (var q = 0; q < toks.length; q++) {
          if (toks[q].w >= 1 && !toks[q].boiler) content += toks[q].w;
          // 2-3 adjacent words glued together, for OCR that drops spaces
          // ("FORDF150" → FORD F 150).
          for (var span = 2; span <= 3 && q + span <= toks.length; span++) {
            var glued = "";
            for (var g2 = q; g2 < q + span; g2++) glued += toks[g2].t;
            if (glued.length >= 5) pairs.push({ a: q, b: q + span - 1, s: canon(glued) });
          }
        }
        t = byKey[key] = { toks: toks, pairs: pairs, content: content, cars: [] };
        titles.push(t);
      }
      t.cars.push(car);
    }
    SC.index = { titles: titles };
    return SC.index;
  }

  function getIndex() {
    if (SC.index) return Promise.resolve(SC.index);
    if (SC.indexP) return SC.indexP;
    SC.indexP = fetch("./data/scan-index.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(prepIndex);
    var p = SC.indexP;
    p.catch(function () { if (SC.indexP === p) SC.indexP = null; });
    return p;
  }

  function lev(a, b) {
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      var tmp = prev; prev = cur; cur = tmp;
    }
    return prev[n];
  }

  // Fold characters OCR commonly swaps, applied to both sides of a comparison.
  function canon(s) { return s.replace(/0/g, "O").replace(/1/g, "I").replace(/5/g, "S"); }

  function ocrContext(text) {
    var n = canon(norm(text));
    var toks = n ? n.split(" ") : [];
    var set = {}, uniq = [];
    for (var i = 0; i < toks.length; i++) if (!set[toks[i]]) { set[toks[i]] = true; uniq.push(toks[i]); }
    var joined = toks.join("");
    // Collector numbers as printed on the card, e.g. "179/250" or "3/5".
    var nums = {}, re = /(\d{1,3})\s*\/\s*(\d{1,3})/g, m;
    while ((m = re.exec(String(text || "")))) {
      var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      nums[String(a)] = true; nums[a + "/" + b] = true;
    }
    return { toks: uniq, set: set, joined: joined, nums: nums, memo: {} };
  }

  // How well one casting-name word appears in the OCR text (0..1). Exact word,
  // a word glued to its neighbours (OCR often drops spaces), or a close typo.
  function tokenSim(t, ctx) {
    if (Object.prototype.hasOwnProperty.call(ctx.memo, t)) return ctx.memo[t];
    var key = t;
    t = canon(t);
    var best = ctx.set[t] ? 1 : 0;
    if (!best && t.length >= 4) {
      if (t.length >= 5 && ctx.joined.indexOf(t) !== -1) best = 0.9;
      for (var i = 0; i < ctx.toks.length && best < 1; i++) {
        var o = ctx.toks[i];
        if (o.length < 3 || Math.abs(o.length - t.length) > 2) continue;
        var s = 1 - lev(t, o) / Math.max(t.length, o.length);
        if (s > best) best = s;
      }
      // Model codes: a read number that ends the code ("34" for "BNR34").
      if (best < 0.7 && /\d/.test(t)) {
        for (var q = 0; q < ctx.toks.length; q++) {
          var d = ctx.toks[q];
          if (d.length >= 2 && /^\d+$/.test(d) && t.slice(-d.length) === d) { best = 0.75; break; }
        }
      }
      if (best < 0.7) best = 0;
    }
    ctx.memo[key] = best;
    return best;
  }

        if (i >= regions.length) return text.trim() ? text : raw;
        // The first region (the name zone / bottom strip) usually settles it,
        // so it gets most of the bar; any fallback regions share the rest.
        var n = regions.length, k = i;
        var start = k === 0 ? 0 : (n > 1 ? 0.8 + 0.2 * (k - 1) / (n - 1) : 0);
        var span = k === 0 ? (n > 1 ? 0.8 : 1) : 0.2 / (n - 1);
        SC.read = start; renderProgress();
        return engine.recognize(regions[i++], function (f) {
          if (run !== SC.run) return;
          SC.read = start + span * f; renderProgress();
        }).then(function (lines) {
          if (run !== SC.run) return;
          lines.forEach(function (l) {
            if (isNoiseLine(l.text)) return; // "MATTEL", "3+", logo, warnings
            raw += "\n" + l.text;
            if (l.score >= OCR_MIN_SCORE) text += "\n" + l.text;
          });
        }).then(next);
      }
      return next();
    }).then(function (text) {
      if (run !== SC.run || text == null) return;
      showScanResults(cleanOcr(text));
    }).catch(function (err) {
      if (run !== SC.run) return;
      showScanResults("", "Couldn't read the card: " + (err && err.message ? err.message : err));
    });
  }

  // ---- Results ----
  function showScanResults(text, err) {
    SC.read = null;
    setMode("review");
    setStatus("");
    var cols = SC.carColors;
    $scanColor.innerHTML = cols && cols.length
      ? "Car colour " + cols.map(function (c, i) {
          return '<span class="sw" style="background:' + rgbCss(c.rgb) + '"></span>' +
                 '<span class="swn' + (i ? " minor" : "") + '">' + esc(FAMILY_LABEL[c.family] || c.family) + "</span>";
        }).join("")
      : "";
    $scanText.value = text;
    renderScanMatches(err);
    $scanText.scrollTop = 0;
  }

  function renderScanMatches(err) {
    if (err) { $scanList.innerHTML = '<div class="empty">' + esc(err) + "</div>"; return; }
    if (!SC.index) {
      $scanList.innerHTML = '<div class="empty">Loading catalog…</div>';
      getIndex().then(function () { renderScanMatches(); }, function (e) {
        renderScanMatches("Couldn't load the catalog index: " + e.message);
      });
      return;
    }
    if (!$scanText.value.trim()) {
      SC.matches = [];
      $scanList.innerHTML = '<div class="empty">No text found. Try again closer and without glare, ' +
                            "or type the car name above.</div>";
      return;
    }
    var m = matchCards($scanText.value);
    if (!m.length) {
      SC.matches = [];
      $scanList.innerHTML = '<div class="empty">No matching car found. Edit the text above ' +
                            "to just the car name, or retake the photo.</div>";
      return;
    }
    // Colour re-ranking: a small bonus, so it orders variants of the same
    // casting (same name score) but can't beat a clearly better name match.
    var colors = SC.carColors;
    m.forEach(function (x) {
      x.fit = colorFit(colors, x.car.color);
      x.rank = x.score + (x.fit == null ? 0 : 0.12 * x.fit);
    });
    m.sort(function (a, b) {
      return b.rank - a.rank || parseInt(b.car.year, 10) - parseInt(a.car.year, 10);
    });
    m = SC.matches = m.slice(0, 20);
    var html = "";
    for (var i = 0; i < m.length; i++) {
      var c = m[i].car;
      var pct = Math.round(Math.min(m[i].score, 1) * 100);
      var meta = [c.year, labelFor(c.assort), c.series, c.num ? "#" + c.num : "", c.color]
                 .filter(Boolean).join(" · ");
      var tags = "";
      if (c.rarity === "sth") tags += '<span class="tag gold">Super TH</span>';
      else if (c.rarity === "th") tags += '<span class="tag silver">Treasure Hunt</span>';
      else if (c.rarity === "chase") tags += '<span class="tag chase">Chase</span>';
      if (m[i].sku) tags += '<span class="tag">SKU ' + esc(c.sku) + " match</span>";
      // Its database colour is the car's main colour.
      if (m[i].fit === 1) {
        tags += '<span class="tag colormatch">Colour match</span>';
      }
      html +=
        '<div class="scanrow' + (i === 0 && m[i].score >= 0.8 ? " best" : "") + '" data-i="' + i + '">' +
          '<div class="sthumb">' +
            (c.img ? '<img loading="lazy" src="' + esc(scanImg(c.id)) + '" alt="">' : NOIMG_HTML) +
          "</div>" +
          '<div class="bd"><div class="nm">' + esc(c.title) + "</div>" +
            '<div class="mt">' + esc(meta) + "</div>" +
            (tags ? '<div class="tags">' + tags + "</div>" : "") +
            ctlBox(c.id, "row") +
          "</div>" +
          '<span class="pct">' + pct + "%</span>" +
        "</div>";
    }
    $scanList.innerHTML = html;
  }

  // Load the match's collection if needed, then hand off to the detail view.
  function openScanMatch(c) {
    var run = ++SC.run;
    function open() {
      if (!SC.open || run !== SC.run) return;
      for (var i = 0; i < CARS.length; i++) {
        if (CARS[i].id === c.id) {
          closeScanner(true);  // keep its history entry; the detail reuses it
          showDetail(CARS[i], { replaceHistory: true });
          return;
        }
      }
      setStatus("Couldn't open this car.");
    }
    if (curAssort === c.assort && curYear === c.year && CARS.length) { open(); return; }
    setStatus("Opening…");
    $search.value = ""; queryText = "";
    loadCollection(c.assort, c.year).then(open);
  }

  // ---- Open / close ----
  function openScanner() {
    if (SC.open) return;
    SC.open = true;
    $scanner.setAttribute("aria-hidden", "false");
    $scanText.value = "";
    $scanList.innerHTML = "";
    try { history.pushState({ scan: true }, ""); } catch (e) {}
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeScanner);
    }
    // Start downloading the catalog index and OCR engine while the user aims.
    getIndex().catch(function () {});
    if (L) L.prepare(); // Have it / Want it on results may need Google's popup
    getEngine().catch(function () {});
    startCamera();
  }

  // fromPop / keepHistory = true: don't pop the history entry ourselves.
  function closeScanner(fromPop) {
    if (!SC.open) return;
    SC.open = false;
    SC.run++;
    stopCamera();
    $scanner.className = "scanner";
    $scanner.setAttribute("aria-hidden", "true");
    clearSnap();
    SC.read = null;
    if (tg && tg.BackButton) {
      tg.BackButton.hide();
      tg.BackButton.offClick(closeScanner);
    }
    if (fromPop !== true) { try { history.back(); } catch (e) {} }
  }

  $scanBtn.addEventListener("click", openScanner);
  $scanClose.addEventListener("click", function () { closeScanner(); });
  $scanShutter.addEventListener("click", function () {
    if (SC.dl) return; // text reader still downloading (button is disabled too)
    var card = grabFrame();
    if (!card) { setStatus("Camera is starting…"); return; }
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("medium"); } catch (e) {} }
    runScan(function () { return liveRegions(card); }, card, CAR_AREA_LIVE);
  });
  $scanRetake.addEventListener("click", startCamera);
  $scanUpload.addEventListener("click", function () { if (!SC.dl) $scanFile.click(); });
  $scanFile.addEventListener("change", function () {
    var f = $scanFile.files && $scanFile.files[0];
    $scanFile.value = "";
    if (!f || !SC.open) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var preview = toCanvas(img, 0, 0, img.naturalWidth, img.naturalHeight, 1200);
      runScan(function () {
        var regions = photoRegions(img);
        URL.revokeObjectURL(url);
        return regions;
      }, preview, CAR_AREA_PHOTO);
    };
    img.onerror = function () { URL.revokeObjectURL(url); setStatus("Couldn't open that image."); };
    img.src = url;
  });
  var scanTextTimer = null;
  $scanText.addEventListener("input", function () {
    clearTimeout(scanTextTimer);
    scanTextTimer = setTimeout(function () { renderScanMatches(); }, 250);
  });
  $scanList.addEventListener("click", function (e) {
    // + / − / bookmark on a result: save without leaving the scanner.
    var ob = e.target.closest ? e.target.closest("[data-own]") : null;
    if (ob) {
      var row0 = ob.closest(".scanrow");
      var sm = row0 && SC.matches[parseInt(row0.getAttribute("data-i"), 10)];
      if (sm) ownAct(ob, { id: sm.car.id, y: sm.car.year, a: sm.car.assort, t: sm.car.title });
      return;
    }
    var row = e.target.closest ? e.target.closest(".scanrow") : null;
    if (!row) return;
    var m = SC.matches[parseInt(row.getAttribute("data-i"), 10)];
    if (m) openScanMatch(m.car);
  });
  document.addEventListener("keydown", function (e) {
    if (SC.open && e.key === "Escape") closeScanner();
  });

  // --- My collection & wishlist (browser only) ---

  // folder) with a localStorage copy. This part is only the UI: the header
  // account button + sheet, Have it / Want it in the detail view, grid

  // (LISTS_ON false) lists.js is never loaded, so L stays null and every

  var $acctBtn = document.getElementById("acctBtn");

  var toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg;

    toastTimer = setTimeout(function () { $toast.classList.remove("show"); }, 3500);

  var BOOKMARK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>';

  var MINUS_SVG = '<svg class="pm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>';

  // Collection controls for one car: "+" (not owned) or "− n +" (copies
  // owned), and a bookmark for the wishlist. mode: "tile" (grid photo),
  // "row" (scan results, My cars) or "full" (detail view, with labels).
  function ctlHtml(id, mode) {
    var q = L.qty(id), w = L.has("wishlist", id), det = mode === "full";
    var add = q
      ? (det ? '<span class="qlbl">In your collection</span>' : "") +
        '<span class="qty" role="group" aria-label="Copies in your collection">' +
          '<button type="button" data-own="dec" aria-label="Remove one" title="Remove one">' + MINUS_SVG + "</button>" +
          '<span class="n">' + q + "</span>" +
          '<button type="button" data-own="inc" aria-label="Add one more" title="Add one more">' + PLUS_SVG + "</button>" +
        "</span>"
      : '<button type="button" class="qadd" data-own="inc" aria-label="Add to my collection" title="Add to my collection">' +
          PLUS_SVG + (det ? "Add to collection" : "") + "</button>";
    // Once a car is owned, the wishlist doesn't apply, so no bookmark.
    if (q) return add;
    var wl = w ? "Remove from wishlist" : "Add to wishlist";
    var wish = '<button type="button" class="wish' + (w ? " on" : "") + '" data-own="wish" aria-pressed="' + w +
               '" aria-label="' + wl + '" title="' + wl + '">' + BOOKMARK_SVG +
               (det ? (w ? "On wishlist" : "Wishlist") : "") + "</button>";
    return add + wish;
  }

  // The container, tagged with the car id so refreshCtls() can redraw it.
  // Empty in Telegram (lists.js isn't loaded there).
  function ctlBox(id, mode) {
    if (!L) return LISTS_ON && mode === "full" ? '<div class="ownctl full" data-id="' + esc(id) + '"></div>' : "";
    return '<div class="ownctl ' + mode + '" data-id="' + esc(id) + '">' + ctlHtml(id, mode) + "</div>";
  }

  // Redraw every control on screen (grid, detail, scan results, My cars), or
  // add them to the grid if lists.js loaded after the grid was drawn.
  function refreshCtls() {
    if (!L) return;
    var boxes = document.querySelectorAll(".ownctl[data-id]");
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i], mode = b.classList.contains("tile") ? "tile" : b.classList.contains("full") ? "full" : "row";
      var html = ctlHtml(b.getAttribute("data-id"), mode);
      if (b.innerHTML !== html) b.innerHTML = html;
    }
    var thumbs = $grid.querySelectorAll(".card > .thumb");
    for (var k = 0; k < thumbs.length; k++) {
      if (!thumbs[k].querySelector(":scope > .ownctl")) {
        thumbs[k].insertAdjacentHTML("beforeend", ctlBox(thumbs[k].parentNode.getAttribute("data-id"), "tile"));
      }
    }
  }

  function ownCounts() {
    var o = 0, w = 0;
    if (L) {
      for (var i = 0; i < CARS.length; i++) {
        if (L.has("collection", CARS[i].id)) o++;
        if (L.has("wishlist", CARS[i].id)) w++;
      }
    }
    return { owned: o, wanted: w };
  }

  // A tap on +, − or the bookmark. car: { id, y (year), a (collection key), t (title) }.
  // Runs inside the click, so lists.js can open Google's sign-in popup.
  function ownAct(btn, car) {
    if (!L) return;
    var act = btn.getAttribute("data-own");
    var signedIn = !!L.user();
    var p = act === "wish" ? L.toggle("wishlist", car) : L.step(car, act === "dec" ? -1 : 1);
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
    p.then(function (r) {
      if (act === "wish") toast(r ? "Saved to your wishlist." : "Removed from your wishlist.");
      else if (!signedIn && r) toast("Signed in. Added to your collection.");
      else if (act === "dec" && !r) toast("Removed from your collection.");
    }, function (err) {
      toast(err && err.message ? err.message : "Couldn't sign in.");
    });
  }

  function initialOf(u) {
    return String((u && (u.name || u.email)) || "?").trim().charAt(0).toUpperCase() || "?";
  }

  function renderAcctBtn() {
    if (!LISTS_ON) return;
    var u = L && L.user(), st = L ? L.state() : "signed-out";
    $acctBtn.classList.toggle("in", !!u);
    $acctBtn.innerHTML = (u ? esc(initialOf(u)) : PERSON_SVG) +
      '<span class="adot' + (st === "unsynced" ? " warn" : st === "error" ? " err" : "") + '"></span>';
    $acctBtn.title = u ? "My collection (" + u.email + ")" : "Sign in to keep your collection";
  }

  function statusLine() {
    var st = L.state(), msg = L.message();
    var text = st === "synced" ? "✓ Saved to your Google Drive."
      : st === "syncing" ? "Syncing…"
      : st === "unsynced" ? "Changes not saved to Google Drive yet."
      : st === "stale" ? "Tap Sync now to get changes from your other devices."
      : st === "error" ? "Sync problem." : "";
    var cls = st === "synced" ? " ok" : st === "unsynced" ? " warn" : st === "error" ? " err" : "";
    return '<div class="st' + cls + '">' + esc(text) + (msg ? " " + esc(msg) : "") + "</div>";
  }

  function renderAcctSheet() {
    if (!ACCT.open) return;
    var html;
    var u = L && L.user();
    if (!L) {
      html = "<p>Loading…</p>";
    } else if (!u) {
      html =
        "<p>Sign in with Google to keep a list of the cars you own and the cars you want, on all your devices.</p>" +
        "<p>Your lists are saved in your own Google Drive, in a hidden folder only this app can open. " +
        "We don't have a server and never see your data.</p>" +
        '<button class="gbtn" type="button" data-act="signin">' + G_SVG + "Sign in with Google</button>";
    } else {

      html =
        '<div class="who"><span class="av">' + esc(initialOf(u)) + "</span>" +
          '<div><div class="unm">' + esc(u.name || "Signed in") + '</div><div class="uem">' + esc(u.email) + "</div></div></div>" +
        statusLine() +
        '<div class="series-row" data-act="mycars"><span class="nm">My cars</span>' +
          '<span class="ct">' + c.collection + " owned · " + c.wishlist + " wanted</span></div>" +
        '<div class="series-row" data-act="sync"><span class="nm">Sync now</span></div>' +
        '<div class="series-row" data-act="export"><span class="nm">Export (JSON)</span></div>' +
        '<div class="series-row danger" data-act="delete"><span class="nm">Delete my data</span></div>' +
        '<div class="series-row" data-act="signout"><span class="nm">Sign out</span></div>';
    }
    if (ACCT.err) html += '<div class="msg">' + esc(ACCT.err) + "</div>";
    html += '<div class="foot"><a href="./privacy.html" target="_blank" rel="noopener">Privacy: what is stored and where</a></div>';

  function openAcctSheet() {
    if (!LISTS_ON) return;

  function exportLists() {
    var url = URL.createObjectURL(L.exportJSON());
    var a = document.createElement("a");
    a.href = url;
    a.download = "diecastdb-lists.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);

  $acctBtn.addEventListener("click", openAcctSheet);

  document.getElementById("acctClose").addEventListener("click", closeAcctSheet);
  $acctBody.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || !L) return;
    var act = el.getAttribute("data-act");
    ACCT.err = "";
    if (act === "signin") {
      L.signIn().then(function () {

      }, function (err) {

    } else if (act === "mycars") {
      closeAcctSheet();

      exportLists();
    } else if (act === "delete") {
      if (!window.confirm("Delete your collection and wishlist from your Google Drive and this device? This can't be undone.")) return;
      L.deleteAll().then(function () { toast("Your data was deleted."); }, function () {});
    } else if (act === "signout") {
      if (L.hasUnsaved() &&
          !window.confirm("Some changes aren't saved to Google Drive yet and will be lost. Sign out anyway?")) return;
      L.signOut();
      toast("Signed out.");
    }
    renderAcctSheet();
  });

  // ---- My cars screen ----
  function scanById() {
    if (MC.byId) return MC.byId;
    if (!SC.index) return null;
    var m = {}, t = SC.index.titles;
    for (var i = 0; i < t.length; i++) {
      for (var j = 0; j < t[i].cars.length; j++) m[t[i].cars[j].id] = t[i].cars[j];
    }

  function renderMyCars() {
    if (!MC.open || !L) return;
    var c = L.counts();
    $mcTabs.innerHTML =
      '<div class="chip' + (MC.tab === "collection" ? " active" : "") + '" data-tab="collection">Collection (' + c.collection + ")</div>" +
      '<div class="chip' + (MC.tab === "wishlist" ? " active" : "") + '" data-tab="wishlist">Wishlist (' + c.wishlist + ")</div>";

    var all = L.entries(MC.tab), idx = scanById();
    var terms = $mcSearch.value.toLowerCase().split(/\s+/).filter(Boolean);
    var rows = [], html = "";
    for (var i = 0; i < all.length; i++) {
      var e = all[i], m = idx ? idx[e.id] : null;
      var title = (m && m.title) || e.t || e.id;
      if (terms.length) {
        var hay = [title, e.id, e.y, labelFor(e.a), m ? m.series : "", m ? m.sku : ""].join(" ").toLowerCase();
        var ok = true;
        for (var k = 0; k < terms.length; k++) if (hay.indexOf(terms[k]) === -1) { ok = false; break; }
        if (!ok) continue;
      }
      var meta = [e.y, labelFor(e.a), m ? m.series : ""].filter(Boolean).join(" · ");
      var tags = "";
      if (m && m.rarity === "sth") tags += '<span class="tag gold">Super TH</span>';
      else if (m && m.rarity === "th") tags += '<span class="tag silver">Treasure Hunt</span>';
      else if (m && m.rarity === "chase") tags += '<span class="tag chase">Chase</span>';
      if (idx && !m) tags += '<span class="tag">Not in catalog</span>';
      html +=
        '<div class="scanrow" data-i="' + rows.length + '">' +
          '<div class="sthumb">' +
            ((!m || m.img) ? '<img loading="lazy" src="' + esc(scanImg(e.id)) + '" alt="">' : NOIMG_HTML) +
          "</div>" +
          '<div class="bd"><div class="nm">' + esc(title) + "</div>" +
            '<div class="mt">' + esc(meta) + "</div>" +
            (tags ? '<div class="tags">' + tags + "</div>" : "") +
            ctlBox(e.id, "row") +
          "</div>" +
        "</div>";
      rows.push(e);
    }
    MC.rows = rows;
    if (!all.length) {
      html = '<div class="empty">' + (MC.tab === "collection"
        ? "No cars yet. Open a car and tap <b>Have it</b>."
        : "No cars yet. Open a car and tap <b>Want it</b>.") + "</div>";
    } else if (!rows.length) {
      html = '<div class="empty">No matches.</div>';
    }
    $mcList.innerHTML = html;
  }

  function openMyCars() {
    if (!L || MC.open) return;
    MC.open = true;
    $mcSearch.value = "";
    $mycars.classList.add("open");
    $mycars.setAttribute("aria-hidden", "false");
    renderMyCars();
    $mcList.scrollTop = 0;
    try { history.pushState({ mycars: true }, ""); } catch (e) {}
    // The scan index adds series, rarity and "not in catalog" to each row.
    if (!SC.index) {
      getIndex().then(function () { MC.byId = null; renderMyCars(); }, function () {});
    }
  }

  function closeMyCars(fromPop) {
    if (!MC.open) return;
    MC.open = false;
    MC.run++;
    $mycars.classList.remove("open");
    $mycars.setAttribute("aria-hidden", "true");
    if (fromPop !== true) { try { history.back(); } catch (e) {} }
  }

  // Load the car's collection-year if needed, then open its detail on top.
  function openMyCar(e) {
    var run = ++MC.run;
    function show() {
      if (!MC.open || run !== MC.run) return;
      for (var i = 0; i < CARS.length; i++) {
        if (CARS[i].id === e.id) { showDetail(CARS[i]); return; }
      }
      toast("This car isn't in the catalog any more.");
    }
    if (yearsFor(e.a).indexOf(e.y) === -1) { toast("This car isn't in the catalog any more."); return; }
    if (curAssort === e.a && curYear === e.y && CARS.length) { show(); return; }
    $search.value = ""; queryText = "";
    loadCollection(e.a, e.y).then(show);
  }

  document.getElementById("mcBack").addEventListener("click", function () { closeMyCars(); });
  $mcTabs.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!t) return;
    MC.tab = t.getAttribute("data-tab");
    renderMyCars();
    $mcList.scrollTop = 0;
  });
  var mcSearchTimer = null;
  $mcSearch.addEventListener("input", function () {
    clearTimeout(mcSearchTimer);
    mcSearchTimer = setTimeout(renderMyCars, 120);
  });
  $mcList.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".scanrow") : null;
    if (!row) return;
    var entry = MC.rows[parseInt(row.getAttribute("data-i"), 10)];
    if (!entry) return;
    var ownBtn = e.target.closest("[data-own]");
    if (ownBtn) { ownAct(ownBtn, { id: entry.id, y: entry.y, a: entry.a, t: entry.t }); return; }
    openMyCar(entry);
  });
  // A missing photo shows the "No photo" wheel instead of a broken image.
  $mcList.addEventListener("error", function (e) {
    var img = e.target;
    if (img && img.tagName === "IMG" && img.parentNode) img.parentNode.innerHTML = NOIMG_HTML;
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (ACCT.open) { closeAcctSheet(); return; }
    if (MC.open && !Z.open && !SC.open && !$detail.classList.contains("open")) closeMyCars();
  });

  function onListsChange(what) {
    renderAcctBtn();
    renderAcctSheet();
    if (!what || !what.lists) return;
    refreshCtls();
    if (ownFilter) render();
    var oc = ownCounts();
    if (CARS.length && oc.owned + "," + oc.wanted !== OWN_SIG) renderFilters();
    renderMyCars();
  }

  (function loadLists() {
    if (!LISTS_ON) return;
    $acctBtn.hidden = false;
    renderAcctBtn();
    var s = document.createElement("script");
    s.src = "./lists.js";
    s.async = true;
    s.onload = function () {
      if (!window.DiecastLists) return;
      L = window.DiecastLists;
      L.on("change", onListsChange);
      L.init();
      onListsChange({ lists: true });
    };
    s.onerror = function () { $acctBtn.hidden = true; };
    document.head.appendChild(s);
  })();

  // --- Boot: load the manifest, then the default collection ---
  fetch("./data/index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (m) {
      MANIFEST = m || {};
      if (MANIFEST.file_pattern) FILE_PATTERN = MANIFEST.file_pattern;
      var list = assortmentList();
      if (!list.length) throw new Error("manifest has no assortments");

      var def = MANIFEST.default || {};
      var assort = def.assortment && assortmentEntry(def.assortment) ? def.assortment : list[0].key;

      // Default to the current calendar year if the assortment has it, else its
      // newest year.
      var years = yearsFor(assort);
      var thisYear = String(new Date().getFullYear());
      var year = years.indexOf(thisYear) !== -1 ? thisYear : years[0];

      loadCollection(assort, year);
    })
    .catch(function (err) {
      $grid.innerHTML = '<div class="empty">Couldn\'t load the catalog index.<br>' + esc(err.message) + "</div>";
    });
})();
</script>

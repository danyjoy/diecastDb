<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Hot Wheels Catalog Browser</title>
<meta name="description" content="Browse Hot Wheels Mainline, Premium and Silver Series castings — photos, search, series filters and Treasure Hunt / Chase highlights." />

<!-- Open Graph / Twitter card for link previews (WhatsApp, Telegram, etc.).
     Uses a PNG (SVG is not supported by preview scrapers). URLs are absolute,
     as required by social scrapers. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Hot Wheels Catalog Browser" />
<meta property="og:title" content="Hot Wheels Catalog Browser" />
<meta property="og:description" content="Browse Hot Wheels Mainline, Premium and Silver Series castings — photos, search, series filters and Treasure Hunt / Chase highlights." />
<meta property="og:url" content="https://danyjoy.github.io/diecastDb/" />
<meta property="og:image" content="https://danyjoy.github.io/diecastDb/og-image.png" />
<meta property="og:image:width" content="1000" />
<meta property="og:image:height" content="1000" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Hot Wheels Catalog Browser" />
<meta name="twitter:description" content="Browse Hot Wheels Mainline, Premium and Silver Series castings." />
<meta name="twitter:image" content="https://danyjoy.github.io/diecastDb/og-image.png" />

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Dark is the default theme (matches the reference UI). */
    --bg: #000000;
    --bg2: #0c0d10;
    --text: #ffffff;
    --hint: #8a8f98;
    --card: #15171c;
    --card2: #1c1f26;
    --accent: #2f8fff;
    --border: #22252d;
    --gold: #e9b949;
    --gold-bg: #2a2410;
    --silver: #c4c9d4;
    --silver-bg: #1e2026;
    /* Chase uses the same gold treatment as Super TH. */
    --chase: #e9b949;
    --chase-bg: #2a2410;
  }
  /* Always dark — we intentionally do not follow Telegram's light theme. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Go-to-top button (shown once the header scrolls away) ---------- */
  .totop {
    position: fixed; z-index: 15; /* above the grid, below detail (20) / sheets (30) */
    right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(14px) scale(.9); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .totop.show { opacity: 1; transform: none; pointer-events: auto; }
  .totop:active { transform: scale(.92); }
  .totop svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6;
    stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 .title-name { line-height: 1.1; }
  /* Logo sits to the left of the heading. */
  .titlebar { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
  .titlebar .logo { flex: 0 0 auto; height: 34px; width: auto; display: block; }
  /* Year dropdown button inside the header title. */
  .year-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 15px; font-weight: 700; letter-spacing: .5px;
    color: var(--accent); background: var(--card2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 5px 11px; cursor: pointer; text-transform: none;
  }
  .year-btn.single { background: transparent; border-color: transparent; color: var(--hint); cursor: default; padding-left: 0; }
  .year-btn .caret { font-size: 11px; opacity: .85; }
  .searchwrap { position: relative; }
  .searchwrap svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; fill: none; stroke: var(--hint); stroke-width: 2;
  }
  .search {
    width: 100%;
    padding: 11px 14px 11px 38px;
    font-size: 16px; /* >=16px stops iOS zoom-on-focus */
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .search::placeholder { color: var(--hint); }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 2px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  /* STH chip: gold text/star on the normal dark chip so it reads as a highlight,
     not a selected state. Fills solid gold only when actually active. */
  .chip.sth { color: var(--gold); border-color: var(--border); font-weight: 700; }
  .chip.sth.active { background: var(--gold); color: #1a1500; border-color: var(--gold); }
  /* TH chip uses the silver accent when active. */
  .chip.th.active { background: var(--silver); color: #16181d; border-color: var(--silver); }
  /* Chase chip (premium): violet highlight, solid when active. */
  .chip.chase { color: var(--chase); border-color: var(--border); font-weight: 700; }
  .chip.chase.active { background: var(--chase); color: #1a1500; border-color: var(--chase); }

  /* "Series ▾" dropdown pill — opens the bottom sheet. Shows the chosen series
     (with an × to clear) when one is active, so the long list stays hidden. */
  .chip.series-pick { display: inline-flex; align-items: center; gap: 6px; }
  .chip.series-pick.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .chip.series-pick .caret { font-size: 10px; opacity: .8; }
  .chip.series-pick .clear {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,.25); font-size: 11px; line-height: 1;
  }

  /* ---------- Series bottom sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none; }
  .sheet.open { display: block; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 80vh; display: flex; flex-direction: column;
    background: var(--bg); border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    animation: sheetUp .18s ease;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 10px; font-weight: 700; font-size: 16px;
  }
  .sheet-close {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer;
  }
  .sheet-search { padding: 0 16px 10px; }
  /* Icon is positioned against the padded wrapper, so offset it by the 16px
     side padding and center it on the input itself (ignore the bottom padding). */
  .sheet-search svg { left: 29px; top: 13px; transform: none; }
  .series-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 8px 12px; }
  .series-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 12px; border-radius: 10px; cursor: pointer;
  }
  .series-row:active { background: var(--card); }
  .series-row.active { background: var(--card); }
  .series-row .nm { font-weight: 600; }
  .series-row.active .nm { color: var(--accent); }
  .series-row .ct {
    font-size: 12px; color: var(--hint);
    background: var(--card2); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 999px; flex: 0 0 auto;
  }
  .series-row .tick { color: var(--accent); font-weight: 700; margin-left: 4px; }

  /* Collection bar: Year group + Assortment group (what to browse). */
  /* Assortment menu (Mainline / Boulevard / …) — a pill row under the search. */
  .collbar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 0 0; scrollbar-width: none;
  }
  .collbar::-webkit-scrollbar { display: none; }
  .collbtn {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .collbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .count { color: var(--hint); font-size: 12px; padding: 10px 0 0; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 14px 16px 24px;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    transition: transform .08s ease;
  }
  .card:active { transform: scale(0.98); }
  /* Treasure Hunt → silver card; Super Treasure Hunt → gold card. */
  .card.th { background: var(--silver-bg); border-color: var(--silver); }
  .card.sth { background: var(--gold-bg); border-color: var(--gold); }
  .card.chase { background: var(--chase-bg); border-color: var(--chase); }
  /* Soft chase (silver series): a subtle silver outline, lighter than TH. */
  .card.softchase { border-color: var(--silver); }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;           /* product shots look best on white, as in the app */
  }
  .card.th .thumb { background: #eceef2; }
  .card.sth .thumb { background: #f7edcf; }
  .card.chase .thumb { background: #f7edcf; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* ---------- Image loading / empty states ---------- */
  /* The rolling-wheel Lottie (wheel-loader.json) shows while an image loads.
     It's prepended inside the image box so badges / buttons still sit on top. */
  .ldr {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .ldr-anim { width: 46%; max-width: 160px; aspect-ratio: 1 / 1; }
  .hero .ldr-anim { width: 34%; }
  .zstage .ldr-anim { width: 140px; }
  /* Fallback if the Lottie player can't load: the same wheel, CSS-spun. */
  .ldr.fallback svg { width: 100%; height: 100%; animation: ldrspin .9s linear infinite; }
  @keyframes ldrspin { to { transform: rotate(360deg); } }
  .thumb.loading img, .hero.loading img, .zstage.loading img { opacity: 0; }
  .noimg {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: #8a8f98; font-size: 12px; font-weight: 600;
  }
  .noimg svg { width: 42%; max-width: 150px; opacity: .3; }
  .hero .noimg svg { width: 30%; }

  .badge {
    position: absolute;
    top: 7px; left: 7px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 6px;
    letter-spacing: .3px;
  }
  .badge.th { background: var(--silver); color: #16181d; }
  .badge.sth { background: var(--gold); color: #1a1500; }
  .badge.chase { background: var(--chase); color: #1a1500; }
  .badge.soft { background: var(--silver); color: #16181d; }

  .cardbody { padding: 9px 10px 11px; }
  .cardbody .title {
    font-weight: 700; font-size: 13px; text-transform: uppercase;
    letter-spacing: .3px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.5em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag {
    font-size: 11px; color: #c7ccd4;
    background: var(--card2); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 6px; white-space: nowrap;
  }
  .card.th .tag { background: #252830; border-color: #3a3f4a; color: #c4c9d4; }
  .card.sth .tag { background: #342c12; border-color: #4a3f1a; color: #d8c78a; }
  .card.chase .tag { background: #342c12; border-color: #4a3f1a; color: #d8c78a; }
  .tag.silver { color: var(--silver); border-color: #3a3f4a; }
  .tag.gold { color: var(--gold); border-color: #4a3f1a; }
  .tag.chase { color: var(--chase); border-color: #4a3f1a; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 40px 20px; }

  /* ---------- Detail overlay ---------- */
  .detail {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
    flex-direction: column;
  }
  .detail.open { display: flex; }

  .dbar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  /* Inside Telegram the native BackButton handles back, so hide our bar. */
  body.in-telegram .dbar { display: none; }
  .backbtn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 15px; font-weight: 600;
    padding: 8px 14px 8px 10px; border-radius: 10px; cursor: pointer;
  }
  .backbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; }

  .dscroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .hero { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #fff; }
  .hero img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .dlbtn {
    position: absolute; right: 12px; bottom: 12px;
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.18);
    color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .dlbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }
  .dlbtn:active { opacity: .7; }
  .dlbtn.busy { opacity: .5; pointer-events: none; }
  .dlbtn.done { background: var(--accent); border-color: var(--accent); }
  .hero img { cursor: zoom-in; }
  .zoomhint {
    position: absolute; left: 12px; bottom: 12px; pointer-events: none;
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.18); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .zoomhint svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

  /* ---------- Fullscreen zoom viewer ---------- */
  .zoomer {
    position: fixed; inset: 0; z-index: 40; background: #000;
    display: none; flex-direction: column;
    -webkit-user-select: none; user-select: none;
  }
  .zoomer.open { display: flex; }
  .zstage {
    position: relative; flex: 1; overflow: hidden;
    touch-action: none; /* we handle pinch / pan / swipe ourselves */
    background: #fff;
  }
  .zstage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; transform-origin: 50% 50%;
    will-change: transform; -webkit-user-drag: none; cursor: zoom-in;
  }
  .zstage img.zoomed { cursor: grab; }
  .zstage img.anim { transition: transform .22s ease; }
  .zbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    pointer-events: none;
  }
  .zbar > * { pointer-events: auto; }
  .zcount {
    color: #fff; font-weight: 700; font-size: 14px;
    background: rgba(0,0,0,.62); padding: 7px 12px; border-radius: 10px;
  }
  .zbtns { display: flex; gap: 8px; }
  .zbtn {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.18);
    color: #fff; cursor: pointer; font-size: 18px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .zbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }
  .zbtn:active { opacity: .7; }
  .zbtn.busy { opacity: .5; pointer-events: none; }
  .zbtn.done { background: var(--accent); border-color: var(--accent); }
  .znav {
    position: absolute; top: 50%; z-index: 2; transform: translateY(-50%);
  }
  .znav.prev { left: 12px; }
  .znav.next { right: 12px; }
  .znav[hidden] { display: none; }

  .gallery {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px; scrollbar-width: none;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img {
    height: 60px; width: 60px; object-fit: contain; background: #fff;
    border-radius: 10px; border: 2px solid transparent; cursor: pointer;
    flex: 0 0 auto; padding: 3px;
  }
  .gallery img.sel { border-color: var(--accent); }

  .info { padding: 16px 16px 40px; }
  .info h2 {
    margin: 2px 0 4px; font-size: 22px; font-weight: 800; text-transform: uppercase;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .info h2 .ttl { flex: 1; min-width: 0; }
  .copybtn {
    flex: 0 0 auto; margin-top: 2px;
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .copybtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
  .copybtn.copied { background: var(--accent); border-color: var(--accent); color: #fff; }
  .info .sub { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .info .rarity { display: inline-block; margin: 8px 0 4px; font-weight: 700; font-size: 12px;
    padding: 4px 10px; border-radius: 8px; }
  .info .rarity.th { background: var(--silver-bg); color: var(--silver); }
  .info .rarity.sth { background: var(--gold-bg); color: var(--gold); }
  .info .rarity.chase { background: var(--chase-bg); color: var(--chase); }
  .info .rarity.meta { background: var(--card2); color: var(--hint); }

  .spec { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .spec .k { color: var(--hint); }
  .spec .v { text-align: right; font-weight: 600; }
  .spec .v.link { color: var(--accent); cursor: pointer; }
  .spec .v.link:active { opacity: .6; }
  .info .sub .sublink { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .info .sub .sublink:active { opacity: .6; }

  /* ---------- Card scanner (camera → OCR → catalog match) ---------- */
  .search.has-scan { padding-right: 50px; }
  .scanbtn {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 34px; border-radius: 9px;
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .scanbtn:active { opacity: .7; }
  .searchwrap .scanbtn svg, .scanner svg {
    position: static; transform: none; width: 19px; height: 19px;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .scanner {
    position: fixed; inset: 0; z-index: 35; /* above sheets (30), below zoomer (40) */
    background: #000; display: none; flex-direction: column;
  }
  .scanner.open { display: flex; }
  .scanbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .scanbar .ttl { font-weight: 700; font-size: 16px; }
  .scanstage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #000; }
  .scanstage video, .scanstage .snap {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .scanstage video { object-fit: cover; }
  .scanstage .snap { object-fit: contain; display: none; }
  /* Card frame (blister card is roughly 3:4 portrait). The bottom zone marks
     where the name is printed; that strip is read first, enlarged. Keep the
     zone's top in sync with NAME_ZONE_TOP in the script. */
  .scanframe {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%);
    width: 82%; height: 78%; border-radius: 14px; pointer-events: none;
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 0 0 9999px rgba(0,0,0,.5);
  }
  .scanzone {
    position: absolute; left: 0; right: 0; top: 66%; bottom: 0;
    border-top: 2px dashed var(--accent); border-radius: 0 0 12px 12px;
    background: rgba(47,143,255,.14);
  }
  .scanzone::before {
    content: "Car name"; position: absolute; left: 10px; top: 8px;
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .3px;
    background: var(--accent); padding: 3px 8px; border-radius: 6px;
  }
  /* Progress bar (text reader download / reading a card). Sits at the top of
     the camera area so it never covers the name zone. */
  .scanprog {
    position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2;
    background: rgba(0,0,0,.72); border-radius: 12px; padding: 9px 12px 8px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .scanprog[hidden] { display: none; }
  .scanprog .track {
    position: relative; height: 6px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden;
  }
  /* Filled with transform (not width) and topped with a moving sheen: both
     run on the compositor, so they keep animating while the text reader
     briefly blocks the page. */
  .scanprog .bar {
    position: absolute; inset: 0; border-radius: 999px; background: var(--accent);
    transform-origin: 0 50%; transform: scaleX(0); transition: transform .3s ease;
  }
  .scanprog .track::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    animation: scansheen 1.1s linear infinite;
  }
  @keyframes scansheen { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .scanprog .lbl { margin-top: 6px; color: #fff; font-size: 12px; font-weight: 600; }
  .scanstatus {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    max-width: calc(100% - 24px); text-align: center;
    background: rgba(0,0,0,.7); color: #fff; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 10px; pointer-events: none;
  }
  .scanstatus:empty { display: none; }
  /* Camera: [Photo]  (shutter)  [ ] with the shutter exactly centred.
     Review: [Photo] [Retake] as two equal buttons. */
  .scanctl {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .scanctl .side {
    min-width: 92px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  }
  .scanctl #scanUpload { justify-self: start; }
  .scanctl .side:active { opacity: .7; }
  .scanctl .side:disabled { opacity: .4; cursor: default; }
  .scanctl .spacer { min-width: 92px; }
  .scanner.review .scanctl { grid-template-columns: 1fr 1fr; }
  .scanner.review .scanctl .spacer { display: none; }
  .scanner.review .scanctl .side,
  .scanner.review .scanctl #scanUpload { justify-self: stretch; padding: 12px; }
  .shutter {
    width: 66px; height: 66px; border-radius: 50%; cursor: pointer;
    background: #fff; border: 4px solid var(--accent); box-shadow: 0 0 0 3px #fff inset;
  }
  .shutter:active { transform: scale(.94); }
  .shutter:disabled { opacity: .4; cursor: default; }
  .shutter:disabled:active { transform: none; }
  .scanres { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px 16px; background: var(--bg); }
  .scanres label { display: block; color: var(--hint); font-size: 12px; margin: 0 0 6px; }
  .scantext {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 16px;
    color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; outline: none;
  }
  .scanlist { margin-top: 12px; }
  .scancolor { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--hint); font-size: 12px; }
  .scancolor:empty { display: none; }
  .scancolor .sw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(255,255,255,.35); }
  .scancolor .swn { color: var(--text); font-weight: 700; margin-right: 6px; }
  .scancolor .swn.minor { color: var(--hint); font-weight: 600; }
  .tag.colormatch { color: #7fd1a0; border-color: #2d5a40; }
  .scanlist .empty { padding: 24px 10px; }
  .scanrow {
    display: flex; align-items: center; gap: 12px; padding: 9px 8px;
    border-radius: 12px; cursor: pointer;
  }
  .scanrow:active, .scanrow.best { background: var(--card); }
  .scanrow .sthumb {
    position: relative; flex: 0 0 auto; width: 58px; height: 58px; border-radius: 10px;
    background: #fff; overflow: hidden;
  }
  .scanrow .sthumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .scanrow .bd { flex: 1; min-width: 0; }
  .scanrow .nm { font-weight: 700; font-size: 14px; text-transform: uppercase; line-height: 1.25; }
  .scanrow .mt { color: var(--hint); font-size: 12px; margin-top: 3px; }
  .scanrow .tags { margin-top: 5px; }
  .scanrow .pct {
    flex: 0 0 auto; font-size: 12px; color: var(--hint);
    background: var(--card2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px;
  }
  .scanrow.best .pct { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* Modes: live camera / reading / reviewing results / no camera available. */
  .scanner.review .scanstage { flex: 0 0 26vh; }
  .scanner.review .scanres { display: block; }
  .scanner.review video, .scanner.busy video { display: none; }
  .scanner.review .snap, .scanner.busy .snap { display: block; }
  .scanner.review .scanframe, .scanner.busy .scanframe, .scanner.nocam .scanframe { display: none; }
  .scanner .only-live, .scanner .only-review { display: none; }
  .scanner.live .only-live, .scanner.nocam .only-live, .scanner.review .only-review { display: inline-flex; }
  .scanner.nocam .shutter { visibility: hidden; }
  .scanner.busy .scanctl { pointer-events: none; opacity: .5; }

  /* ---------- My collection & wishlist (browser only, see lists.js) ---------- */
  :root { --own: #1f8a4c; --want: #d6336c; }
  /* Search box + account button share a row; the title row stays as before. */
  .searchrow { display: flex; align-items: center; gap: 8px; }
  .searchrow .searchwrap { flex: 1; min-width: 0; }
  .acctbtn {
    position: relative; flex: 0 0 auto;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .acctbtn[hidden] { display: none; }
  .acctbtn.in { background: var(--accent); border-color: var(--accent); color: #fff; }
  .acctbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .acctbtn .adot { position: absolute; right: -1px; top: -1px; width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid var(--bg); display: none; }
  .acctbtn .adot.warn { display: block; background: #f0a830; }
  .acctbtn .adot.err { display: block; background: #ff5a5a; }

  .acct { padding: 0 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .acct p { color: var(--hint); font-size: 14px; margin: 0 0 12px; }
  .gbtn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 4px; padding: 12px; border-radius: 12px; border: 0; cursor: pointer;
    background: #fff; color: #1f1f1f; font-size: 15px; font-weight: 700;
  }
  .gbtn svg { width: 20px; height: 20px; }
  .acct .who { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .acct .av { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: var(--accent);
    color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
  .acct .unm { font-weight: 700; }
  .acct .uem { color: var(--hint); font-size: 13px; word-break: break-all; }
  .acct .st { font-size: 13px; padding: 9px 12px; border-radius: 10px; margin-bottom: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--hint); }
  .acct .st.ok { color: #7fd1a0; }
  .acct .st.warn { color: #f0c070; }
  .acct .st.err { color: #ff8a8a; }
  .acct .series-row { padding: 12px 6px; }
  .acct .series-row.danger .nm { color: #ff8a8a; }
  .acct .msg { color: #ff8a8a; font-size: 13px; margin-top: 10px; }
  .acct .foot { margin-top: 12px; font-size: 12px; color: var(--hint); }
  .acct .foot a { color: var(--accent); }

  /* Collection controls: "+" that becomes "− n +" (copies owned), and a
     bookmark for the wishlist. Same markup on grid cards, scan results and
     the detail view; the container class sets the size and layout. */
  .ownctl button { font: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .qadd, .qty, .wish {
    height: 32px; border-radius: 9px; border: 1.5px solid var(--accent);
    background: #fff; color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .ownctl .qadd { min-width: 32px; padding: 0 6px; gap: 6px; font-weight: 800; }
  .qty { padding: 0; overflow: hidden; }
  .ownctl .qty button { width: 30px; height: 100%; padding: 0; border: 0; background: transparent;
    color: inherit; display: inline-flex; align-items: center; justify-content: center; }
  .ownctl svg.pm { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.8;
    stroke-linecap: round; flex: 0 0 auto; }
  .qty .n { min-width: 16px; text-align: center; font-size: 16px; font-weight: 800; }
  .wish { width: 32px; padding: 0; gap: 6px; }
  .wish svg { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor;
    stroke-width: 2.2; stroke-linejoin: round; }
  .wish.on { color: var(--want); border-color: var(--want); }
  .wish.on svg { fill: currentColor; }
  .qadd:active, .qty button:active, .wish:active { opacity: .6; }

  /* Grid card: top-right of the photo, clear of the rarity badge (top-left). */
  .ownctl.tile { position: absolute; top: 7px; right: 7px; z-index: 2;
    display: flex; align-items: center; gap: 6px; }
  .ownctl.tile .wish { order: -1; } /* bookmark left of +, so + stays in the corner */

  /* Off the white photo (detail view, scan results, My cars): dark controls
     that match the theme. The grid tile keeps the white ones above. */
  .ownctl.row .qadd, .ownctl.row .qty, .ownctl.row .wish,
  .ownctl.full .qadd, .ownctl.full .qty, .ownctl.full .wish {
    background: var(--card2); border-color: var(--border); color: var(--accent); box-shadow: none;
  }
  .ownctl.row .qty, .ownctl.full .qty { border-color: var(--accent); }
  .ownctl.full .qadd { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ownctl.row .wish.on, .ownctl.full .wish.on { color: var(--want); border-color: var(--want); }
  /* Scan results and My cars rows. */
  .ownctl.row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  /* Detail view: full-width row with labels. */
  .ownctl.full { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }
  .ownctl.full .qadd, .ownctl.full .qty, .ownctl.full .wish { height: 42px; border-radius: 12px; }
  .ownctl.full .qadd { flex: 1; font-size: 15px; }
  .ownctl.full .qty button { width: 40px; }
  .ownctl.full .qlbl { flex: 1; font-weight: 700; color: var(--text); }
  .ownctl.full .wish { width: auto; padding: 0 14px; font-size: 14px; }
  .chip.own.active { background: var(--own); border-color: var(--own); color: #fff; }
  .chip.want.active { background: var(--want); border-color: var(--want); color: #fff; }

  /* My cars: full screen, below the detail view (20) so a car opens on top. */
  .mycars { position: fixed; inset: 0; z-index: 18; background: var(--bg); display: none; flex-direction: column; }
  .mycars.open { display: flex; }
  .mchead { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .mchead .ttl { font-weight: 800; font-size: 17px; }
  .mctabs { display: flex; gap: 8px; padding: 12px 16px 0; }
  .mcsearch { padding: 12px 16px 4px; }
  .mclist { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 8px 24px; }
  .mclist .sthumb .noimg span { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 45;
    transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); text-align: center;
    background: #2a2d35; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <div class="titlebar">
      <img class="logo" src="./logo-header.svg" alt="" />
      <h1 id="title">Hot Wheels</h1>
    </div>
    <div class="searchrow">
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" class="search has-scan" type="search" placeholder="Search series, vehicles, SKU…" autocomplete="off" />
      <button id="scanBtn" class="scanbtn" type="button" title="Scan a card" aria-label="Scan a card with the camera">
        <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.6"/></svg>
      </button>
    </div>
      <!-- My collection: browser only, unhidden by loadLists() -->
      <button id="acctBtn" class="acctbtn" type="button" hidden aria-label="My collection"></button>
    </div>
    <div id="collbar" class="collbar"></div>
    <div id="filters" class="filters"></div>
    <div id="count" class="count"></div>
  </header>

  <div id="grid" class="grid"></div>

  <button id="toTop" class="totop" type="button" title="Back to top" aria-label="Back to top" tabindex="-1">
    <svg viewBox="0 0 24 24"><polyline points="6 14 12 8 18 14"/></svg>
  </button>

  <div id="detail" class="detail">
    <div class="dbar">
      <button id="backBtn" class="backbtn" type="button">
        <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        Back
      </button>
    </div>
    <div class="dscroll">
      <div class="hero">
        <img id="heroImg" alt="" title="Tap to zoom" />
        <span class="zoomhint" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="20.5" y2="20.5"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </span>
        <button id="dlBtn" class="dlbtn" type="button" title="Download image" aria-label="Download image">
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><polyline points="7 10 12 15 17 10"/><path d="M5 20h14"/></svg>
        </button>
      </div>
      <div id="gallery" class="gallery"></div>
      <div id="info" class="info"></div>
    </div>
  </div>

  <!-- My cars: the user's collection and wishlist (browser only, see lists.js) -->
  <div id="mycars" class="mycars" aria-hidden="true">
    <div class="mchead">
      <button id="mcBack" class="backbtn" type="button">
        <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        Back
      </button>
      <span class="ttl">My cars</span>
    </div>
    <div id="mcTabs" class="mctabs"></div>
    <div class="mcsearch">
      <div class="searchwrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="mcSearch" class="search" type="search" placeholder="Search your cars…" autocomplete="off" />
      </div>
    </div>
    <div id="mcList" class="mclist scanlist"></div>
  </div>

  <!-- Fullscreen zoom viewer -->
  <div id="zoomer" class="zoomer" aria-hidden="true">
    <div id="zStage" class="zstage">
      <img id="zImg" alt="" draggable="false" />
    </div>
    <div class="zbar">
      <span id="zCount" class="zcount"></span>
      <div class="zbtns">
        <button id="zDl" class="zbtn" type="button" title="Download image" aria-label="Download image">
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><polyline points="7 10 12 15 17 10"/><path d="M5 20h14"/></svg>
        </button>
        <button id="zClose" class="zbtn" type="button" title="Close" aria-label="Close">✕</button>
      </div>
    </div>
    <button id="zPrev" class="zbtn znav prev" type="button" aria-label="Previous image">
      <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
    </button>
    <button id="zNext" class="zbtn znav next" type="button" aria-label="Next image">
      <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
    </button>
  </div>

  <!-- Series picker (bottom sheet) -->
  <div id="sheet" class="sheet">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span id="sheetTitle">Filter</span>
        <button id="sheetClose" class="sheet-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="searchwrap sheet-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="seriesSearch" class="search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div id="seriesList" class="series-list"></div>
    </div>
  </div>

  <!-- Year picker (bottom sheet) -->
  <div id="yearSheet" class="sheet">
    <div class="sheet-backdrop" id="yearBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span>Select year</span>
        <button id="yearClose" class="sheet-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="yearList" class="series-list"></div>
    </div>
  </div>

  <!-- Account / My collection (bottom sheet, browser only) -->

    <div class="sheet-backdrop" id="acctBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span>My collection</span>
        <button id="acctClose" class="sheet-close" type="button" aria-label="Close">✕</button>

  <!-- Card scanner: camera → OCR → match against data/scan-index.json -->
  <div id="scanner" class="scanner" aria-hidden="true">

      <div id="scanColor" class="scancolor"></div>
      <div id="scanList" class="scanlist"></div>

      <button id="scanUpload" class="side" type="button">

        Photo

        Retake
      </button>
      <span class="spacer"></span>
    </div>
    <input id="scanFile" type="file" accept="image/*" hidden />
  </div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  // Detect a genuine Telegram Mini App launch. The SDK script loads in any
  // browser, so window.Telegram always exists — but initData is only populated
  // when actually opened inside Telegram. We use that as the real signal.
  var inTelegram = !!(tg && tg.initData && tg.initData.length > 0);

  // Always dark — we do NOT follow Telegram's colour scheme (it could be light
  // and wash out the gallery). We only push the dark colour to Telegram's own
  // chrome so the header/background match, even on a light client.
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor && tg.setHeaderColor("#000000"); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor("#000000"); } catch (e) {}
  }

  // Inside Telegram, its native BackButton handles going back, so hide the
  // in-page Back bar to avoid two back buttons.
  if (inTelegram) document.body.classList.add("in-telegram");

  // My collection & wishlist (lists.js, saved to the user's Google Drive) is
  // browser-only. In the Telegram Mini App none of it is loaded or shown.
  var LISTS_ON = !inTelegram;
  var L = null;              // window.DiecastLists once lists.js has loaded

  var CARS = [];
  var activeSeries = null;   // null = all
  var rarityFilter = null;   // null | "th" (TH + STH)
  var ownFilter = null;      // null | "owned" | "wanted" (needs lists.js)
  var queryText = "";

  var MANIFEST = null;       // data/index.json
  var curYear = null;        // selected year (string)
  var curAssort = null;      // selected assortment key (string)
  // Two-level grouping. Mainline is one level (series_name). Premium / Silver
  // Series are two levels: group = assortment (Car Culture, Fast & Furious, …),
  // subgroup = series_name (Nitro Grid, World Tour, …). An assortment like
  // Boulevard has no inner series, so its subgroup list is simply empty.
  var GROUP_FIELD = "series_name";   // first-level field
  var GROUP_LABEL = "Series";        // first-level pill label
  var SUBGROUP_FIELD = null;         // second-level field (null = single level)
  var SUBGROUP_LABEL = "Series";     // second-level pill label
  var SOFT_CHASE_ON = false;         // collection has soft chases (Silver Series)
  var SOFT_CHASE = {};               // set of car ids that are soft chases

  var activeSub = null;              // selected second-level value (null = all)

  function groupOf(car) {
    return (car[GROUP_FIELD] || "").toString().trim();
  }
  function subOf(car) {
    return SUBGROUP_FIELD ? (car[SUBGROUP_FIELD] || "").toString().trim() : "";
  }
  // Back-compat alias used elsewhere: the first-level grouping value.
  function seriesOf(car) { return groupOf(car); }

  function isMetalBase(car) {
    return String(car.base_material || "").toLowerCase() === "metal";
  }

  function isSoftChase(car) {
    return SOFT_CHASE_ON && !!SOFT_CHASE[car.id];
  }

  // Soft chase = the metal-base car within a real series. A "real series" is
  // keyed by (assortment + series_name) — e.g. Fast & Furious has two 5-car
  // series, "Nitro Grid" and "Life", each with its own soft chase. We only mark
  // it when a series has EXACTLY ONE metal-base car, so themed/multi-sets that
  // mix several metal cars don't get mislabelled.
  function computeSoftChase() {
    SOFT_CHASE = {};
    if (!SOFT_CHASE_ON) return;
    var groups = {};
    for (var i = 0; i < CARS.length; i++) {
      var c = CARS[i];
      var key = (c.assortment || "") + " :: " + (c.series_name || "");
      (groups[key] = groups[key] || []).push(c);
    }
    for (var k in groups) {
      if (!groups.hasOwnProperty(k)) continue;
      var metal = groups[k].filter(isMetalBase);
      if (metal.length === 1) SOFT_CHASE[metal[0].id] = true;
    }
  }

  var $title = document.getElementById("title");
  var $search = document.getElementById("search");
  var $collbar = document.getElementById("collbar");
  var $filters = document.getElementById("filters");
  var $sheet = document.getElementById("sheet");
  var $sheetBackdrop = document.getElementById("sheetBackdrop");
  var $sheetClose = document.getElementById("sheetClose");
  var $sheetTitle = document.getElementById("sheetTitle");
  var $seriesSearch = document.getElementById("seriesSearch");
  var $seriesList = document.getElementById("seriesList");
  var $yearSheet = document.getElementById("yearSheet");
  var $yearBackdrop = document.getElementById("yearBackdrop");
  var $yearClose = document.getElementById("yearClose");
  var $yearList = document.getElementById("yearList");
  var $grid = document.getElementById("grid");
  var $count = document.getElementById("count");
  var $detail = document.getElementById("detail");
  var $heroImg = document.getElementById("heroImg");
  var $gallery = document.getElementById("gallery");
  var $info = document.getElementById("info");
  var $dscroll = document.querySelector(".dscroll");
  var $backBtn = document.getElementById("backBtn");
  var $dlBtn = document.getElementById("dlBtn");
  var $zoomHint = document.querySelector(".zoomhint");
  var $zoomer = document.getElementById("zoomer");
  var $zStage = document.getElementById("zStage");
  var $zImg = document.getElementById("zImg");
  var $zCount = document.getElementById("zCount");
  var $zDl = document.getElementById("zDl");
  var $zClose = document.getElementById("zClose");
  var $zPrev = document.getElementById("zPrev");
  var $zNext = document.getElementById("zNext");

  // ---------- Image loaders ----------
  // While an image loads we show the rolling-wheel Lottie (wheel-loader.json)
  // inside its box. A static SVG of the same wheel is used for "No photo" and
  // as a CSS-spun fallback until (or if) the Lottie player is available.
  var WHEEL_SVG =
    '<svg viewBox="0 0 200 200" aria-hidden="true"><g transform="translate(100 100)">' +
      '<circle r="61" fill="#1c1f26"/><circle r="42" fill="#c4c9d4"/><circle r="33" fill="#3a3f4b"/>' +
      [0, 72, 144, 216, 288].map(function (a) {
        return '<rect x="-4.5" y="-34" width="9" height="30" rx="4" fill="#c4c9d4" transform="rotate(' + a + ')"/>';
      }).join("") +
      '<circle r="8" fill="#2f8fff"/></g></svg>';
  var NOIMG_HTML = '<div class="noimg">' + WHEEL_SVG + "<span>No photo</span></div>";

  var LOTTIE_SRC = "https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie_light.min.js";
  var LOTTIE_SRI = "sha384-Gr3FGWSrOz4fzm9bvrWwhuQH87JMUCLlOTaHhpddbnlHHWCZPxMeQ3KUPsomzIii";
  var WHEEL_JSON = null; // raw JSON text; parsed per instance (lottie mutates it)

  function lottieReady() { return !!(window.lottie && WHEEL_JSON); }

  function mountLoader(box) {
    var ex = box.querySelector(":scope > .ldr");
    if (ex && !(ex.classList.contains("fallback") && lottieReady())) return;
    if (ex) unmountLoader(box); // upgrade a CSS fallback to the Lottie
    var wrap = document.createElement("div");
    wrap.className = "ldr";
    var inner = document.createElement("div");
    inner.className = "ldr-anim";
    wrap.appendChild(inner);
    box.insertBefore(wrap, box.firstChild);
    if (lottieReady()) {
      try {
        box._ldr = window.lottie.loadAnimation({
          container: inner, renderer: "svg", loop: true, autoplay: true,
          animationData: JSON.parse(WHEEL_JSON)
        });
        return;
      } catch (e) { inner.innerHTML = ""; }
    }
    wrap.classList.add("fallback");
    inner.innerHTML = WHEEL_SVG;
  }

  function unmountLoader(box) {
    if (box._ldr) { try { box._ldr.destroy(); } catch (e) {} box._ldr = null; }
    var ex = box.querySelector(":scope > .ldr");
    if (ex) ex.remove();
  }

  // Image finished (ok=true) or failed: drop the loader, show "No photo" on failure.
  function imageDone(box, img, ok) {
    box.classList.remove("loading");
    unmountLoader(box);
    if (!ok) {
      img.style.visibility = "hidden";
      if (!box.querySelector(":scope > .noimg")) box.insertAdjacentHTML("afterbegin", NOIMG_HTML);
    }
  }

  // Point a reused <img> (hero / zoom viewer) at `src`, with loader + empty state.
  function loadInto(box, img, src) {
    var ni = box.querySelector(":scope > .noimg");
    if (ni) ni.remove();
    img.style.visibility = "";
    var tok = (box._tok || 0) + 1;
    box._tok = tok;
    if (!src) {
      img.removeAttribute("src");
      imageDone(box, img, false);
      return;
    }
    img.onload = function () { if (box._tok === tok) imageDone(box, img, true); };
    img.onerror = function () { if (box._tok === tok) imageDone(box, img, false); };
    box.classList.add("loading");
    img.src = src;
    if (img.complete && img.naturalWidth) imageDone(box, img, true); // already cached
    else mountLoader(box);
  }

  // Grid thumbnails: there can be hundreds, so a Lottie only runs for tiles
  // that are on screen and still loading. load/error don't bubble, so we
  // listen in the capture phase on the grid.
  var thumbIO = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
    for (var i = 0; i < entries.length; i++) {
      var box = entries[i].target;
      if (!box.classList.contains("loading")) { thumbIO.unobserve(box); continue; }
      if (entries[i].isIntersecting) mountLoader(box); else unmountLoader(box);
    }
  }, { rootMargin: "100px" }) : null;

  function observeThumbs() {
    var boxes = $grid.querySelectorAll(".thumb.loading");
    for (var i = 0; i < boxes.length; i++) {
      var img = boxes[i].querySelector("img");
      if (img && img.complete) { imageDone(boxes[i], img, img.naturalWidth > 0); continue; }
      if (thumbIO) thumbIO.observe(boxes[i]);
    }
  }

  function thumbEvent(e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG") return;
    var box = img.parentNode;
    if (!box || !box.classList || !box.classList.contains("thumb")) return;
    if (thumbIO) thumbIO.unobserve(box);
    imageDone(box, img, e.type === "load");
  }

  // Load the Lottie player (pinned + SRI) and the animation, then upgrade any
  // loaders that started as the CSS fallback.
  function upgradeLoaders() {
    if (!lottieReady()) return;
    var f = document.querySelectorAll(".ldr.fallback");
    for (var i = 0; i < f.length; i++) mountLoader(f[i].parentNode);
  }
  (function loadLottie() {
    var s = document.createElement("script");
    s.src = LOTTIE_SRC; s.integrity = LOTTIE_SRI; s.crossOrigin = "anonymous"; s.async = true;
    s.onload = upgradeLoaders;
    document.head.appendChild(s);
    fetch("./wheel-loader.json").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (t) { WHEEL_JSON = t; upgradeLoaders(); }).catch(function () {});
  })();

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Copy text to the clipboard. The Clipboard API is flaky inside Telegram's
  // in-app browser, so fall back to a hidden textarea + execCommand. Shows a
  // brief "copied" state on the button and a light haptic tap when available.
  function copyText(text, btn) {
    function done() {
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
      if (btn) {
        btn.classList.add("copied");
        setTimeout(function () { btn.classList.remove("copied"); }, 1200);
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        return;
      }
    } catch (e) {}
    fallbackCopy(text);
    done();
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "absolute";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
  }

  function rarityClass(r) {
    var v = String(r || "").toLowerCase();
    if (v === "super treasure hunt") return "sth";
    if (v === "treasure hunt") return "th";
    if (v === "chase") return "chase";
    return null;
  }

  function matches(car) {
    if (activeSeries && groupOf(car) !== activeSeries) return false;
    if (activeSub && subOf(car) !== activeSub) return false;
    // rarityFilter: null (all), "th"/"sth"/"chase" (rarity), or "soft" (soft chase).
    if (rarityFilter === "soft") { if (!isSoftChase(car)) return false; }
    else if (rarityFilter && rarityClass(car.rarity) !== rarityFilter) return false;
    if (ownFilter && !(L && L.has(ownFilter === "owned" ? "collection" : "wishlist", car.id))) return false;
    if (queryText) {
      var hay = [car.title, car.series_name, car.assortment, car.sku, car.casting_number,
                 car.oem, car.rarity, car.body_color, car.mainline_index]
                 .join(" ").toLowerCase();
      var terms = queryText.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  function render() {
    var list = CARS.filter(matches);
    $count.textContent = list.length + (list.length === 1 ? " vehicle" : " vehicles");

    if (list.length === 0) {
      $grid.innerHTML = '<div class="empty">No vehicles match.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var thumb = (c.images && c.images[0]) || "";
      var rc = rarityClass(c.rarity);
      var badge = rc === "sth" ? '<span class="badge sth">$TH</span>'
               : rc === "th" ? '<span class="badge th">TH</span>'
               : rc === "chase" ? '<span class="badge chase">CHASE</span>' : "";
      var rarityTag = rc === "sth"
        ? '<span class="tag gold">Super TH</span>'
        : rc === "th" ? '<span class="tag silver">Treasure Hunt</span>'
        : rc === "chase" ? '<span class="tag chase">Chase</span>' : "";
      // Collector number: mainlines use mainline_index, premium lines use
      // series_index. Only show the tag when there's an actual number.
      var idx = c.mainline_index || c.series_index || "";
      var idxTag = idx ? '<span class="tag">#' + esc(idx) + "</span>" : "";
      // Third tag: the car's sub-line (Car Culture, Boulevard, …) for premium,
      // or the collection label otherwise. Falls back to the collection label
      // when a premium car has no sub-line.
      var lineTag = (c.assortment || "").trim() || labelFor(curAssort);
      var soft = isSoftChase(c);
      // Soft chase (silver series) → a silver "Soft Chase" tag + card highlight.
      // Any other metal-base car just gets an informational "Metal base" tag.
      var metaTag = soft
        ? '<span class="tag silver">Soft Chase</span>'
        : (isMetalBase(c) ? '<span class="tag">Metal base</span>' : "");
      var softBadge = (soft && !badge) ? '<span class="badge soft">SOFT</span>' : "";
      var tags =
        idxTag +
        '<span class="tag">' + esc(c.release_year) + '</span>' +
        '<span class="tag">' + esc(lineTag) + '</span>' +
        rarityTag + metaTag;
      var cls = rc ? (" " + rc) : (soft ? " softchase" : "");
      html +=
        '<div class="card' + cls + '" data-id="' + esc(c.id) + '">' +
          '<div class="thumb' + (thumb ? " loading" : "") + '">' + badge + softBadge +
            (thumb ? '<img loading="lazy" src="' + esc(thumb) + '" alt="">' : NOIMG_HTML) +
            ctlBox(c.id, "tile") +
          '</div>' +
          '<div class="cardbody">' +
            '<div class="title">' + esc(c.title) + '</div>' +
            '<div class="tags">' + tags + '</div>' +
          '</div>' +
        '</div>';
    }
    $grid.innerHTML = html;
    observeThumbs();
  }

  // GROUPS: first-level values with counts. SUBGROUPS: second-level values for
  // the currently selected group (empty when single-level or none exist).
  var GROUPS = [];
  var SUBGROUPS = [];

  function countBy(field, scope) {
    var counts = {};
    for (var i = 0; i < CARS.length; i++) {
      var c = CARS[i];
      if (scope && groupOf(c) !== scope) continue;
      var v = (c[field] || "").toString().trim();
      if (!v) continue;
      counts[v] = (counts[v] || 0) + 1;
    }
    return Object.keys(counts)
      .map(function (n) { return { name: n, count: counts[n] }; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
  }

  function buildSeriesChips() {
    GROUPS = countBy(GROUP_FIELD, null);
    // Subgroups are scoped to the active group (the series inside the chosen
    // assortment). Only meaningful on two-level collections with a group picked.
    SUBGROUPS = (SUBGROUP_FIELD && activeSeries) ? countBy(SUBGROUP_FIELD, activeSeries) : [];
    renderFilters();
  }

  // Compact filter bar: a few high-value chips stay inline; the long series
  // list lives behind a "Series ▾" pill that opens a searchable bottom sheet.
  // This keeps the horizontal strip short instead of ~30 chips to scroll past.
  function renderFilters() {
    var thCount = 0, sthCount = 0, chaseCount = 0;
    for (var t = 0; t < CARS.length; t++) {
      var r = rarityClass(CARS[t].rarity);
      if (r === "th") thCount++;
      else if (r === "sth") sthCount++;
      else if (r === "chase") chaseCount++;
    }

    var html = '<div class="chip' + (!activeSeries && !activeSub && !rarityFilter && !ownFilter ? " active" : "") +
               '" data-kind="all">All</div>';
    // Super TH first — it's the rarest/most important. The chip is gold-styled
    // even when inactive so it stands out in the bar.
    if (sthCount) html += '<div class="chip sth' + (rarityFilter === "sth" ? " active" : "") +
                          '" data-kind="sth">⭐ Super TH (' + sthCount + ")</div>";
    if (thCount) html += '<div class="chip th' + (rarityFilter === "th" ? " active" : "") +
                         '" data-kind="th">Treasure Hunt (' + thCount + ")</div>";
    // Chase (premium only) — gold highlight, between the hunts and series.
    if (chaseCount) html += '<div class="chip chase' + (rarityFilter === "chase" ? " active" : "") +
                            '" data-kind="chase">Chase (' + chaseCount + ")</div>";
    // Soft Chase (silver series) — the metal-base car in each series.
    if (SOFT_CHASE_ON) {
      var softCount = 0;
      for (var sc = 0; sc < CARS.length; sc++) if (isSoftChase(CARS[sc])) softCount++;
      if (softCount) html += '<div class="chip th' + (rarityFilter === "soft" ? " active" : "") +
                             '" data-kind="soft">Soft Chase (' + softCount + ")</div>";
    }

    // Owned / Wanted (browser only): cars of this collection-year in the
    // user's lists. These combine with the other filters.
    var oc = ownCounts();
    OWN_SIG = oc.owned + "," + oc.wanted;
    if (oc.owned || ownFilter === "owned") html += '<div class="chip own' + (ownFilter === "owned" ? " active" : "") +
                                                   '" data-kind="owned">✓ Owned (' + oc.owned + ")</div>";
    if (oc.wanted || ownFilter === "wanted") html += '<div class="chip want' + (ownFilter === "wanted" ? " active" : "") +
                                                     '" data-kind="wanted">♥ Wanted (' + oc.wanted + ")</div>";

    // First-level picker pill (Series for mainline, Assortment for premium/silver).
    if (GROUPS.length) {
      if (activeSeries) {
        html += '<div class="chip series-pick active" data-kind="group-open">' +
                  esc(activeSeries) +
                  '<span class="clear" data-kind="group-clear">✕</span>' +
                '</div>';
      } else {
        html += '<div class="chip series-pick" data-kind="group-open">' +
                  esc(GROUP_LABEL) + ' <span class="caret">▾</span>' +
                '</div>';
      }
    }

    // Second-level picker pill — only on two-level collections, once a group is
    // chosen and that group actually has inner series (Boulevard won't).
    if (SUBGROUP_FIELD && activeSeries && SUBGROUPS.length) {
      if (activeSub) {
        html += '<div class="chip series-pick active" data-kind="sub-open">' +
                  esc(activeSub) +
                  '<span class="clear" data-kind="sub-clear">✕</span>' +
                '</div>';
      } else {
        html += '<div class="chip series-pick" data-kind="sub-open">' +
                  esc(SUBGROUP_LABEL) + ' <span class="caret">▾</span>' +
                '</div>';
      }
    }

    $filters.innerHTML = html;

    // When a series is active, the pill is the last (and widest) chip; scroll
    // the bar fully right so it's completely visible instead of clipped.
    if (activeSeries || activeSub) {
      $filters.scrollLeft = $filters.scrollWidth;
    } else {
      $filters.scrollLeft = 0;
    }
  }

  // --- Picker bottom sheet (shared by the group and subgroup pickers) ---

  var sheetMode = "group"; // "group" (first level) or "sub" (second level)

  function sheetItems() { return sheetMode === "sub" ? SUBGROUPS : GROUPS; }
  function sheetSelected() { return sheetMode === "sub" ? activeSub : activeSeries; }
  function sheetTitle() {
    return sheetMode === "sub" ? SUBGROUP_LABEL : GROUP_LABEL;
  }

  // Render the picker rows, optionally filtered by the sheet's search box.
  // An "All" row at the top clears the current level's filter.
  function renderSeriesList(filterText) {
    var q = String(filterText || "").toLowerCase().trim();
    var items = sheetItems();
    var sel = sheetSelected();
    var allCount = 0;
    for (var a = 0; a < items.length; a++) allCount += items[a].count;

    var rows =
      '<div class="series-row' + (!sel ? " active" : "") +
      '" data-series="__all"><span class="nm">All</span>' +
      '<span class="ct">' + allCount + "</span></div>";

    var shown = 0;
    for (var i = 0; i < items.length; i++) {
      var s = items[i];
      if (q && s.name.toLowerCase().indexOf(q) === -1) continue;
      shown++;
      var on = sel === s.name;
      rows +=
        '<div class="series-row' + (on ? " active" : "") +
        '" data-series="' + esc(s.name) + '">' +
          '<span class="nm">' + esc(s.name) + (on ? ' <span class="tick">✓</span>' : "") + "</span>" +
          '<span class="ct">' + s.count + "</span>" +
        "</div>";
    }
    if (q && shown === 0) {
      rows += '<div class="empty">No matches for “' + esc(filterText) + '”.</div>';
    }
    $seriesList.innerHTML = rows;
  }

  function openSeriesSheet(mode) {
    sheetMode = mode || "group";
    var label = sheetTitle();
    $sheetTitle.textContent = "Filter by " + label.toLowerCase();
    $seriesSearch.value = "";
    $seriesSearch.placeholder = "Search " + label.toLowerCase() + "…";
    renderSeriesList("");
    $sheet.classList.add("open");
    $seriesList.scrollTop = 0;
  }

  function closeSeriesSheet() {
    $sheet.classList.remove("open");
  }

  $sheetBackdrop.addEventListener("click", closeSeriesSheet);
  $sheetClose.addEventListener("click", closeSeriesSheet);

  var seriesSearchTimer = null;
  $seriesSearch.addEventListener("input", function () {
    clearTimeout(seriesSearchTimer);
    seriesSearchTimer = setTimeout(function () {
      renderSeriesList($seriesSearch.value);
    }, 80);
  });

  $seriesList.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".series-row") : null;
    if (!row) return;
    var name = row.getAttribute("data-series");
    var pick = (name === "__all") ? null : name;
    if (sheetMode === "sub") {
      activeSub = pick;
    } else {
      activeSeries = pick;
      activeSub = null; // changing the group resets the sub-selection
    }
    rarityFilter = null;
    closeSeriesSheet();
    buildSeriesChips(); // recompute SUBGROUPS for the (possibly new) group
    render();
    window.scrollTo(0, 0);
  });

  // "<title>-<sku>-<n>.<ext>", filesystem-safe.
  // "<title>-<sku>-<n>.jpg", filesystem-safe. Downloads are always JPEG.
  function imageFileName(car, src, idx) {
    var base = [car.title, car.sku].filter(Boolean).join("-")
      .replace(/[^\w\-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "") || "image";
    return base + "-" + (idx + 1) + ".jpg";
  }

  // Download an image as JPEG. The source images are WebP on findmyhw.com,
  // which sends no CORS headers, so we go through wsrv.nl (a free image proxy
  // that adds Access-Control-Allow-Origin: *) and ask it to convert to JPEG
  // (output=jpg, white background for any transparency). Inside Telegram
  // (Bot API 8.0+) the native downloadFile dialog gets that JPEG URL. In a
  // browser we fetch it → blob → <a download>. If the proxy fails we try the
  // original directly and convert it on a canvas; if that's blocked too we
  // open the original in a new tab.
  function jpgUrl(url) {
    return "https://wsrv.nl/?url=" + encodeURIComponent(url.replace(/^https?:\/\//, "")) +
           "&output=jpg&q=92&bg=white";
  }
  function fetchBlob(u) {
    return fetch(u, { mode: "cors" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    });
  }

    // + / − / bookmark on the photo: change the lists, don't open the car.
    var ownBtn = e.target.closest("[data-own]");
    if (ownBtn) {
      for (var j = 0; j < CARS.length; j++) {
        if (CARS[j].id === id) { ownAct(ownBtn, { id: id, y: curYear, a: curAssort, t: CARS[j].title }); break; }
      }
      return;
    }
    for (var i = 0; i < CARS.length; i++) {
      if (CARS[i].id === id) { showDetail(CARS[i]); break; }
    }
  });

  $filters.addEventListener("click", function (e) {
    // Clear (✕) buttons live inside the active pills; handle them first.
    var clearKind = e.target && e.target.getAttribute("data-kind");
    if (clearKind === "group-clear") {
      activeSeries = null; activeSub = null;
      buildSeriesChips(); render(); window.scrollTo(0, 0);
      return;
    }
    if (clearKind === "sub-clear") {
      activeSub = null;
      buildSeriesChips(); render(); window.scrollTo(0, 0);
      return;
    }

    var kind = chip.getAttribute("data-kind");
    if (kind === "all") { activeSeries = null; activeSub = null; rarityFilter = null; ownFilter = null; }
    else if (kind === "owned" || kind === "wanted") { ownFilter = (ownFilter === kind ? null : kind); }
    else if (kind === "th") { rarityFilter = (rarityFilter === "th" ? null : "th"); activeSeries = null; activeSub = null; }
    else if (kind === "sth") { rarityFilter = (rarityFilter === "sth" ? null : "sth"); activeSeries = null; activeSub = null; }
    else if (kind === "chase") { rarityFilter = (rarityFilter === "chase" ? null : "chase"); activeSeries = null; activeSub = null; }
    else if (kind === "soft") { rarityFilter = (rarityFilter === "soft" ? null : "soft"); activeSeries = null; activeSub = null; }
    else if (kind === "group-open") { openSeriesSheet("group"); return; }
    else if (kind === "sub-open") { openSeriesSheet("sub"); return; }

    render();
    window.scrollTo(0, 0);
  });

  var searchTimer = null;
  $search.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      queryText = $search.value.trim();
      render();
    }, 120);
  });

  // --- Collections (assortment + year), driven by data/index.json ---
  //
  // Manifest model is assortment-first: each assortment lists the years it has.
  // The assortment is the primary choice (a menu row under the header); the
  // year is a dropdown next to the title. Files follow file_pattern, default
  // "{year}/{assortment}.json".

  var FILE_PATTERN = "{year}/{assortment}.json";

  function assortmentList() {
    return (MANIFEST && Array.isArray(MANIFEST.assortments)) ? MANIFEST.assortments : [];
  }

  function assortmentEntry(key) {
    var list = assortmentList();
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }

  function labelFor(key) {
    var a = assortmentEntry(key);
    return (a && a.label) || key;
  }

  // Years an assortment has, newest-first (descending).
  function yearsFor(key) {
    var a = assortmentEntry(key);
    var ys = (a && Array.isArray(a.years)) ? a.years.slice() : [];
    ys.sort(function (x, y) { return parseInt(y, 10) - parseInt(x, 10); });
    return ys;
  }

  function fileFor(assortKey, year) {
    return "./data/" + FILE_PATTERN
      .replace("{year}", String(year))
      .replace("{assortment}", String(assortKey));
  }

  // Assortment menu: one pill per assortment, shown above the filters. Hidden
  // if there's only one assortment (nothing to choose).
  function renderAssortMenu() {
    var list = assortmentList();
    if (list.length <= 1) { $collbar.innerHTML = ""; $collbar.style.display = "none"; return; }
    var html = "";
    for (var i = 0; i < list.length; i++) {
      html += '<button class="collbtn' + (list[i].key === curAssort ? " active" : "") +
              '" data-assort="' + esc(list[i].key) + '">' + esc(list[i].label || list[i].key) + "</button>";
    }
    $collbar.innerHTML = html;
    $collbar.style.display = "flex";
  }

  // Header title + year dropdown. The year control only shows a caret when the
  // assortment has more than one year.
  function renderTitle() {
    var years = yearsFor(curAssort);
    var multi = years.length > 1;
    $title.innerHTML =
      '<span class="title-name">' + esc(labelFor(curAssort)) + "</span>" +
      '<button id="yearBtn" class="year-btn' + (multi ? "" : " single") +
      '" type="button">' + esc(curYear) + (multi ? ' <span class="caret">▾</span>' : "") + "</button>";
    var yb = document.getElementById("yearBtn");
    if (yb && multi) yb.addEventListener("click", openYearSheet);
  }

  // Fetch and show one collection. Resets series/rarity filters since the
  // series list differs per collection. Returns a promise that resolves once
  // CARS holds the new collection (or the load failed).
  function loadCollection(assortKey, year) {
    var years = yearsFor(assortKey);
    if (years.indexOf(String(year)) === -1) year = years[0]; // fall back to newest
    if (!assortKey || !year) {
      $grid.innerHTML = '<div class="empty">No catalog available.</div>';
      return Promise.resolve();
    }
    curAssort = assortKey;
    curYear = String(year);
    activeSeries = null; activeSub = null; rarityFilter = null; ownFilter = null;

    // How this collection groups its filters (one or two levels).
    var entry = assortmentEntry(assortKey);
    GROUP_FIELD = (entry && entry.group_by) || "series_name";
    GROUP_LABEL = (entry && entry.group_label) || "Series";
    SUBGROUP_FIELD = (entry && entry.subgroup_by) || null;
    SUBGROUP_LABEL = (entry && entry.subgroup_label) || "Series";
    SOFT_CHASE_ON = !!(entry && entry.soft_chase);

    renderAssortMenu();
    renderTitle();
    $grid.innerHTML = '<div class="empty">Loading…</div>';

    return fetch(fileFor(assortKey, year), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        CARS = (data && Array.isArray(data.cars)) ? data.cars : [];
        CARS.sort(function (a, b) {
          var ai = parseInt(a.mainline_index, 10), bi = parseInt(b.mainline_index, 10);
          if (isNaN(ai)) ai = 1e9; if (isNaN(bi)) bi = 1e9;
          return ai - bi;
        });
        computeSoftChase();
        buildSeriesChips();
        render();
      })
      .catch(function (err) {
        $grid.innerHTML = '<div class="empty">Couldn\'t load this catalog.<br>' + esc(err.message) + "</div>";
      });
  }

  $collbar.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".collbtn") : null;
    if (!btn) return;
    var key = btn.getAttribute("data-assort");
    if (key && key !== curAssort) {
      // Keep the current year if the new assortment has it, else its newest.
      var keepYear = yearsFor(key).indexOf(curYear) !== -1 ? curYear : null;
      loadCollection(key, keepYear);
      window.scrollTo(0, 0);
    }
  });

  // --- Year picker (reuses the bottom-sheet pattern) ---
  function openYearSheet() {
    var years = yearsFor(curAssort);
    var rows = "";
    for (var i = 0; i < years.length; i++) {
      var on = years[i] === curYear;
      rows +=
        '<div class="series-row' + (on ? " active" : "") + '" data-year="' + esc(years[i]) + '">' +
          '<span class="nm">' + esc(years[i]) + (on ? ' <span class="tick">✓</span>' : "") + "</span>" +
        "</div>";
    }

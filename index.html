<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Hot Wheels Mainline</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Dark is the default theme (matches the reference UI). */
    --bg: #000000;
    --bg2: #0c0d10;
    --text: #ffffff;
    --hint: #8a8f98;
    --card: #15171c;
    --card2: #1c1f26;
    --accent: #2f8fff;
    --border: #22252d;
    --gold: #e9b949;
    --gold-bg: #2a2410;
    --silver: #c4c9d4;
    --silver-bg: #1e2026;
  }
  /* Light theme — applied only when Telegram reports colorScheme === "light".
     Product shots still sit on white; cards get a light surface. */
  body.light {
    --bg: #ffffff;
    --bg2: #f2f3f5;
    --text: #0c0d10;
    --hint: #6b7178;
    --card: #f4f5f7;
    --card2: #e9ebee;
    --accent: #2f8fff;
    --border: #e2e4e8;
    --gold: #b8860b;
    --gold-bg: #fbf3d8;
    --silver: #8a909c;
    --silver-bg: #eceef1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 12px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .searchwrap { position: relative; }
  .searchwrap svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; fill: none; stroke: var(--hint); stroke-width: 2;
  }
  .search {
    width: 100%;
    padding: 11px 14px 11px 38px;
    font-size: 16px; /* >=16px stops iOS zoom-on-focus */
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .search::placeholder { color: var(--hint); }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 2px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .chip.th.active { background: var(--silver); color: #16181d; border-color: var(--silver); }
  .chip.sth.active { background: var(--gold); color: #1a1500; border-color: var(--gold); }

  /* "Series ▾" dropdown pill — opens the bottom sheet. Shows the chosen series
     (with an × to clear) when one is active, so the long list stays hidden. */
  .chip.series-pick { display: inline-flex; align-items: center; gap: 6px; }
  .chip.series-pick.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .chip.series-pick .caret { font-size: 10px; opacity: .8; }
  .chip.series-pick .clear {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,.25); font-size: 11px; line-height: 1;
  }

  /* ---------- Series bottom sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none; }
  .sheet.open { display: block; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 80vh; display: flex; flex-direction: column;
    background: var(--bg); border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    animation: sheetUp .18s ease;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 10px; font-weight: 700; font-size: 16px;
  }
  .sheet-close {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer;
  }
  .sheet-search { padding: 0 16px 10px; }
  .series-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 8px 12px; }
  .series-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 12px; border-radius: 10px; cursor: pointer;
  }
  .series-row:active { background: var(--card); }
  .series-row.active { background: var(--card); }
  .series-row .nm { font-weight: 600; }
  .series-row.active .nm { color: var(--accent); }
  .series-row .ct {
    font-size: 12px; color: var(--hint);
    background: var(--card2); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 999px; flex: 0 0 auto;
  }
  .series-row .tick { color: var(--accent); font-weight: 700; margin-left: 4px; }

  /* Collection bar: Year group + Assortment group (what to browse). */
  .collbar {
    display: flex; gap: 14px; overflow-x: auto;
    padding: 12px 0 0; scrollbar-width: none;
  }
  .collbar::-webkit-scrollbar { display: none; }
  .collgroup { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .collgroup .lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .5px; }
  .collbtn {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 13px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .collbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .count { color: var(--hint); font-size: 12px; padding: 10px 0 0; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 14px 16px 24px;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    transition: transform .08s ease;
  }
  .card:active { transform: scale(0.98); }
  /* Treasure Hunt → silver card; Super Treasure Hunt → gold card. */
  .card.th { background: var(--silver-bg); border-color: var(--silver); }
  .card.sth { background: var(--gold-bg); border-color: var(--gold); }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;           /* product shots look best on white, as in the app */
  }
  .card.th .thumb { background: #eceef2; }
  .card.sth .thumb { background: #f7edcf; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .badge {
    position: absolute;
    top: 7px; left: 7px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 6px;
    letter-spacing: .3px;
  }
  .badge.th { background: var(--silver); color: #16181d; }
  .badge.sth { background: var(--gold); color: #1a1500; }

  .cardbody { padding: 9px 10px 11px; }
  .cardbody .title {
    font-weight: 700; font-size: 13px; text-transform: uppercase;
    letter-spacing: .3px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.5em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag {
    font-size: 10px; color: var(--hint);
    background: var(--card2); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 6px; white-space: nowrap;
  }
  .card.th .tag { background: #252830; border-color: #3a3f4a; color: #c4c9d4; }
  .card.sth .tag { background: #342c12; border-color: #4a3f1a; color: #d8c78a; }
  .tag.silver { color: var(--silver); border-color: #3a3f4a; }
  .tag.gold { color: var(--gold); border-color: #4a3f1a; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 40px 20px; }

  /* ---------- Detail overlay ---------- */
  .detail {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
    flex-direction: column;
  }
  .detail.open { display: flex; }

  .dbar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .backbtn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 15px; font-weight: 600;
    padding: 8px 14px 8px 10px; border-radius: 10px; cursor: pointer;
  }
  .backbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; }

  .dscroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .hero { width: 100%; aspect-ratio: 1 / 1; background: #fff; }
  .hero img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .gallery {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px; scrollbar-width: none;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img {
    height: 60px; width: 60px; object-fit: contain; background: #fff;
    border-radius: 10px; border: 2px solid transparent; cursor: pointer;
    flex: 0 0 auto; padding: 3px;
  }
  .gallery img.sel { border-color: var(--accent); }

  .info { padding: 16px 16px 40px; }
  .info h2 { margin: 2px 0 4px; font-size: 22px; font-weight: 800; text-transform: uppercase; }
  .info .sub { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .info .rarity { display: inline-block; margin: 8px 0 4px; font-weight: 700; font-size: 12px;
    padding: 4px 10px; border-radius: 8px; }
  .info .rarity.th { background: var(--silver-bg); color: var(--silver); }
  .info .rarity.sth { background: var(--gold-bg); color: var(--gold); }

  .spec { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .spec .k { color: var(--hint); }
  .spec .v { text-align: right; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>Discover</h1>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" class="search" type="search" placeholder="Search series, vehicles, SKU…" autocomplete="off" />
    </div>
    <div id="collbar" class="collbar"></div>
    <div id="filters" class="filters"></div>
    <div id="count" class="count"></div>
  </header>

  <div id="grid" class="grid"></div>

  <div id="detail" class="detail">
    <div class="dbar">
      <button id="backBtn" class="backbtn" type="button">
        <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        Back
      </button>
    </div>
    <div class="dscroll">
      <div class="hero"><img id="heroImg" alt="" /></div>
      <div id="gallery" class="gallery"></div>
      <div id="info" class="info"></div>
    </div>
  </div>

  <!-- Series picker (bottom sheet) -->
  <div id="sheet" class="sheet">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span>Filter by series</span>
        <button id="sheetClose" class="sheet-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="searchwrap sheet-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="seriesSearch" class="search" type="search" placeholder="Find a series…" autocomplete="off" />
      </div>
      <div id="seriesList" class="series-list"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  // Dark by default (matches the reference UI). When running inside Telegram we
  // follow its colour scheme: light mode flips to the light palette, otherwise
  // we stay dark. Outside Telegram (plain browser) tg is null, so it's dark.
  function applyScheme() {
    var light = !!(tg && tg.colorScheme === "light");
    document.body.classList.toggle("light", light);
    var bg = light ? "#ffffff" : "#000000";
    try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); } catch (e) {}
    try { tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", bg);
  }

  if (tg) {
    tg.ready();
    tg.expand();
    applyScheme();
    tg.onEvent("themeChanged", applyScheme);
  }

  var CARS = [];
  var activeSeries = null;   // null = all
  var rarityFilter = null;   // null | "th" (TH + STH)
  var queryText = "";

  var MANIFEST = null;       // data/index.json
  var curYear = null;        // selected year (string)
  var curAssort = null;      // selected assortment key (string)

  var $search = document.getElementById("search");
  var $collbar = document.getElementById("collbar");
  var $filters = document.getElementById("filters");
  var $sheet = document.getElementById("sheet");
  var $sheetBackdrop = document.getElementById("sheetBackdrop");
  var $sheetClose = document.getElementById("sheetClose");
  var $seriesSearch = document.getElementById("seriesSearch");
  var $seriesList = document.getElementById("seriesList");
  var $grid = document.getElementById("grid");
  var $count = document.getElementById("count");
  var $detail = document.getElementById("detail");
  var $heroImg = document.getElementById("heroImg");
  var $gallery = document.getElementById("gallery");
  var $info = document.getElementById("info");
  var $dscroll = document.querySelector(".dscroll");
  var $backBtn = document.getElementById("backBtn");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function rarityClass(r) {
    var v = String(r || "").toLowerCase();
    if (v === "super treasure hunt") return "sth";
    if (v === "treasure hunt") return "th";
    return null;
  }

  function matches(car) {
    if (activeSeries && car.series_name !== activeSeries) return false;
    // rarityFilter is null (all), "th" (Treasure Hunt only), or "sth" (Super TH only).
    if (rarityFilter && rarityClass(car.rarity) !== rarityFilter) return false;
    if (queryText) {
      var hay = [car.title, car.series_name, car.sku, car.casting_number,
                 car.oem, car.rarity, car.body_color, car.mainline_index]
                 .join(" ").toLowerCase();
      var terms = queryText.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  function render() {
    var list = CARS.filter(matches);
    $count.textContent = list.length + (list.length === 1 ? " vehicle" : " vehicles");

    if (list.length === 0) {
      $grid.innerHTML = '<div class="empty">No vehicles match.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var thumb = (c.images && c.images[0]) || "";
      var rc = rarityClass(c.rarity);
      var badge = rc === "sth" ? '<span class="badge sth">$TH</span>'
               : rc === "th" ? '<span class="badge th">TH</span>' : "";
      var rarityTag = rc === "sth"
        ? '<span class="tag gold">Super TH</span>'
        : rc === "th" ? '<span class="tag silver">Treasure Hunt</span>' : "";
      var tags =
        '<span class="tag">#' + esc(c.mainline_index) + '</span>' +
        '<span class="tag">' + esc(c.release_year) + '</span>' +
        '<span class="tag">' + esc(c.assortment || "Mainline") + '</span>' +
        rarityTag;
      html +=
        '<div class="card' + (rc ? ' ' + rc : '') + '" data-id="' + esc(c.id) + '">' +
          '<div class="thumb">' + badge +
            (thumb ? '<img loading="lazy" src="' + esc(thumb) + '" alt="">' : "") +
          '</div>' +
          '<div class="cardbody">' +
            '<div class="title">' + esc(c.title) + '</div>' +
            '<div class="tags">' + tags + '</div>' +
          '</div>' +
        '</div>';
    }
    $grid.innerHTML = html;
  }

  // SERIES is rebuilt per collection: [{ name, count }, ...] sorted by count.
  var SERIES = [];

  function buildSeriesChips() {
    var counts = {};
    for (var i = 0; i < CARS.length; i++) {
      var s = CARS[i].series_name || "Unknown";
      counts[s] = (counts[s] || 0) + 1;
    }
    SERIES = Object.keys(counts)
      .map(function (n) { return { name: n, count: counts[n] }; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

    renderFilters();
  }

  // Compact filter bar: a few high-value chips stay inline; the long series
  // list lives behind a "Series ▾" pill that opens a searchable bottom sheet.
  // This keeps the horizontal strip short instead of ~30 chips to scroll past.
  function renderFilters() {
    var thCount = 0, sthCount = 0;
    for (var t = 0; t < CARS.length; t++) {
      var r = rarityClass(CARS[t].rarity);
      if (r === "th") thCount++; else if (r === "sth") sthCount++;
    }

    var html = '<div class="chip' + (!activeSeries && !rarityFilter ? " active" : "") +
               '" data-kind="all">All</div>';
    if (thCount) html += '<div class="chip th' + (rarityFilter === "th" ? " active" : "") +
                         '" data-kind="th">Treasure Hunt (' + thCount + ")</div>";
    if (sthCount) html += '<div class="chip sth' + (rarityFilter === "sth" ? " active" : "") +
                          '" data-kind="sth">Super TH (' + sthCount + ")</div>";

    // Series picker pill (shows the chosen series + a clear button when active).
    if (activeSeries) {
      html += '<div class="chip series-pick active" data-kind="series-open">' +
                esc(activeSeries) +
                '<span class="clear" data-kind="series-clear">✕</span>' +
              '</div>';
    } else {
      html += '<div class="chip series-pick" data-kind="series-open">' +
                'Series <span class="caret">▾</span>' +
              '</div>';
    }

    $filters.innerHTML = html;
  }

  // --- Series bottom sheet ---

  // Render the series rows, optionally filtered by the sheet's search box.
  // Includes an "All series" row at the top to clear the filter.
  function renderSeriesList(filterText) {
    var q = String(filterText || "").toLowerCase().trim();
    var rows =
      '<div class="series-row' + (!activeSeries ? " active" : "") +
      '" data-series="__all"><span class="nm">All series</span>' +
      '<span class="ct">' + CARS.length + "</span></div>";

    var shown = 0;
    for (var i = 0; i < SERIES.length; i++) {
      var s = SERIES[i];
      if (q && s.name.toLowerCase().indexOf(q) === -1) continue;
      shown++;
      var on = activeSeries === s.name;
      rows +=
        '<div class="series-row' + (on ? " active" : "") +
        '" data-series="' + esc(s.name) + '">' +
          '<span class="nm">' + esc(s.name) + (on ? ' <span class="tick">✓</span>' : "") + "</span>" +
          '<span class="ct">' + s.count + "</span>" +
        "</div>";
    }
    if (q && shown === 0) {
      rows += '<div class="empty">No series match “' + esc(filterText) + '”.</div>';
    }
    $seriesList.innerHTML = rows;
  }

  function openSeriesSheet() {
    $seriesSearch.value = "";
    renderSeriesList("");
    $sheet.classList.add("open");
    $seriesList.scrollTop = 0;
  }

  function closeSeriesSheet() {
    $sheet.classList.remove("open");
  }

  $sheetBackdrop.addEventListener("click", closeSeriesSheet);
  $sheetClose.addEventListener("click", closeSeriesSheet);

  var seriesSearchTimer = null;
  $seriesSearch.addEventListener("input", function () {
    clearTimeout(seriesSearchTimer);
    seriesSearchTimer = setTimeout(function () {
      renderSeriesList($seriesSearch.value);
    }, 80);
  });

  $seriesList.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".series-row") : null;
    if (!row) return;
    var name = row.getAttribute("data-series");
    activeSeries = (name === "__all") ? null : name;
    rarityFilter = null;
    closeSeriesSheet();
    renderFilters();
    render();
    window.scrollTo(0, 0);
  });

  function showDetail(car) {
    var imgs = (car.images && car.images.length) ? car.images : [];
    function setHero(src) { $heroImg.src = src || ""; }
    setHero(imgs[0]);

    var g = "";
    for (var i = 0; i < imgs.length; i++) {
      g += '<img data-src="' + esc(imgs[i]) + '" class="' + (i === 0 ? "sel" : "") +
           '" src="' + esc(imgs[i]) + '" alt="">';
    }
    // Hide the gallery strip entirely when there's 0 or 1 image.
    $gallery.style.display = imgs.length > 1 ? "flex" : "none";
    $gallery.innerHTML = g;
    $gallery.onclick = function (e) {
      var t = e.target;
      if (t && t.tagName === "IMG") {
        setHero(t.getAttribute("data-src"));
        var sel = $gallery.querySelectorAll("img");
        for (var i = 0; i < sel.length; i++) sel[i].classList.remove("sel");
        t.classList.add("sel");
      }
    };

    function row(k, v) {
      if (v == null || v === "") return "";
      return '<div class="spec"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span></div>";
    }
    var rc = rarityClass(car.rarity);
    $info.innerHTML =
      "<h2>" + esc(car.title) + "</h2>" +
      '<div class="sub">#' + esc(car.mainline_index) + " · " + esc(car.series_name) + "</div>" +
      (rc ? '<div class="rarity ' + rc + '">' + esc(car.rarity) + "</div>" : "") +
      row("Series #", car.series_index) +
      row("SKU", car.sku) +
      row("Casting #", car.casting_number) +
      row("OEM", car.oem) +
      row("Body color", car.body_color) +
      row("Interior", car.interior_colors) +
      row("Base", [car.base_color, car.base_material].filter(Boolean).join(" / ")) +
      row("Wheels", car.wheel_types) +
      row("Scale", car.scale) +
      row("Designer", car.casting_designer) +
      row("Art director", car.art_director) +
      row("Made in", car.country_of_origin) +
      row("Year", car.release_year);

    $detail.classList.add("open");
    $dscroll.scrollTop = 0;

    // Telegram's native BackButton only renders inside the Telegram client; the
    // in-page Back bar covers the browser/preview case, so both paths work.
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeDetail);
    }
  }

  function closeDetail() {
    $detail.classList.remove("open");
    if (tg && tg.BackButton) {
      tg.BackButton.hide();
      tg.BackButton.offClick(closeDetail);
    }
  }

  // --- Events ---
  $backBtn.addEventListener("click", closeDetail);

  $grid.addEventListener("click", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    var id = card.getAttribute("data-id");
    for (var i = 0; i < CARS.length; i++) {
      if (CARS[i].id === id) { showDetail(CARS[i]); break; }
    }
  });

  $filters.addEventListener("click", function (e) {
    // The clear (✕) lives inside the active series pill; handle it first.
    if (e.target && e.target.getAttribute("data-kind") === "series-clear") {
      activeSeries = null;
      renderFilters();
      render();
      window.scrollTo(0, 0);
      return;
    }
    var chip = e.target.closest ? e.target.closest(".chip") : null;
    if (!chip) return;
    var kind = chip.getAttribute("data-kind");
    if (kind === "all") { activeSeries = null; rarityFilter = null; }
    else if (kind === "th") { rarityFilter = (rarityFilter === "th" ? null : "th"); activeSeries = null; }
    else if (kind === "sth") { rarityFilter = (rarityFilter === "sth" ? null : "sth"); activeSeries = null; }
    else if (kind === "series-open") { openSeriesSheet(); return; }
    renderFilters();
    render();
    window.scrollTo(0, 0);
  });

  var searchTimer = null;
  $search.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      queryText = $search.value.trim();
      render();
    }, 120);
  });

  // --- Collections (year + assortment), driven by data/index.json ---

  function yearEntry(year) {
    var ys = (MANIFEST && MANIFEST.years) || [];
    for (var i = 0; i < ys.length; i++) if (String(ys[i].year) === String(year)) return ys[i];
    return null;
  }

  function assortmentsFor(year) {
    var y = yearEntry(year);
    return (y && Array.isArray(y.assortments)) ? y.assortments : [];
  }

  function fileFor(year, assortKey) {
    var list = assortmentsFor(year);
    for (var i = 0; i < list.length; i++) if (list[i].key === assortKey) return list[i].file;
    return null;
  }

  // Render the Year group + Assortment group. The assortment buttons reflect
  // whatever the selected year offers, so a year with only mainline shows one.
  function renderCollbar() {
    var years = ((MANIFEST && MANIFEST.years) || []).map(function (y) { return String(y.year); });
    var html = "";

    if (years.length > 1) {
      html += '<div class="collgroup"><span class="lbl">Year</span>';
      for (var i = 0; i < years.length; i++) {
        html += '<button class="collbtn' + (years[i] === curYear ? " active" : "") +
                '" data-type="year" data-val="' + esc(years[i]) + '">' + esc(years[i]) + "</button>";
      }
      html += "</div>";
    }

    var assorts = assortmentsFor(curYear);
    if (assorts.length > 1) {
      html += '<div class="collgroup"><span class="lbl">Type</span>';
      for (var j = 0; j < assorts.length; j++) {
        html += '<button class="collbtn' + (assorts[j].key === curAssort ? " active" : "") +
                '" data-type="assort" data-val="' + esc(assorts[j].key) + '">' +
                esc(assorts[j].label || assorts[j].key) + "</button>";
      }
      html += "</div>";
    }

    $collbar.innerHTML = html;
    $collbar.style.display = html ? "flex" : "none";
  }

  // Fetch and show one collection file. Resets series/rarity filters since the
  // series list differs per collection.
  function loadCollection(year, assortKey) {
    var file = fileFor(year, assortKey);
    if (!file) {
      // Fall back to the first assortment the year does have.
      var list = assortmentsFor(year);
      if (list.length) { assortKey = list[0].key; file = list[0].file; }
    }
    if (!file) {
      $grid.innerHTML = '<div class="empty">No catalog available for ' + esc(year) + ".</div>";
      return;
    }
    curYear = String(year);
    curAssort = assortKey;
    activeSeries = null; rarityFilter = null;
    renderCollbar();
    $grid.innerHTML = '<div class="empty">Loading…</div>';

    fetch("./data/" + file, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        CARS = (data && Array.isArray(data.cars)) ? data.cars : [];
        CARS.sort(function (a, b) {
          var ai = parseInt(a.mainline_index, 10), bi = parseInt(b.mainline_index, 10);
          if (isNaN(ai)) ai = 1e9; if (isNaN(bi)) bi = 1e9;
          return ai - bi;
        });
        buildSeriesChips();
        render();
      })
      .catch(function (err) {
        $grid.innerHTML = '<div class="empty">Couldn\'t load this catalog.<br>' + esc(err.message) + "</div>";
      });
  }

  $collbar.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".collbtn") : null;
    if (!btn) return;
    var type = btn.getAttribute("data-type");
    var val = btn.getAttribute("data-val");
    if (type === "year" && val !== curYear) {
      // Keep the same assortment if the new year has it, else its first.
      var keep = fileFor(val, curAssort) ? curAssort : (assortmentsFor(val)[0] || {}).key;
      loadCollection(val, keep);
    } else if (type === "assort" && val !== curAssort) {
      loadCollection(curYear, val);
    }
    window.scrollTo(0, 0);
  });

  // --- Boot: load the manifest, then the default collection ---
  fetch("./data/index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (m) {
      MANIFEST = m || {};
      var def = MANIFEST.default || {};
      var year = def.year || ((MANIFEST.years && MANIFEST.years[0] && MANIFEST.years[0].year) || null);
      var assort = def.assortment || ((assortmentsFor(year)[0] || {}).key);
      if (!year || !assort) throw new Error("manifest has no collections");
      loadCollection(year, assort);
    })
    .catch(function (err) {
      $grid.innerHTML = '<div class="empty">Couldn\'t load the catalog index.<br>' + esc(err.message) + "</div>";
    });
})();
</script>
</body>
</html>
